r": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-23-part-01.md#lf-039"}, {"id": "LF-040", "city": "臨汾市", "name": "樊店關帝廟", "loc": "臨汾市翼城縣樊店村", "era": "戲台、正殿為明代建築；山門、倒座房等為清代建築", "found": "明弘治十八年（1505）創建；清道光十一年（1831）重修", "level": "第七批全國重點文物保護單位（2013），編號7-0891-3-189", "status": "部分覈實", "conf": "A", "note": "戲台脊檁下重修題記記明弘治十八年（1505）創建、道光十一年（1831）重修。現存戲台、正殿為明代，山門及倒座房為清代。國保名錄列明至清。原始座標與公開坐標約有百米級差異，保留原始座標，不將其擅自平移至院落中心。", "access": "位於南唐鄉樊店村內，是否開放及管理聯絡方式未核實；村內通行與入廟需尊重現場管理。", "map": "https://www.google.com/maps/search/?api=1&query=35.68803732,111.60373083", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-23-part-01.md#lf-040"}, {"id": "LF-041", "city": "臨汾市", "name": "木·石四牌坊", "loc": "臨汾市翼城縣城內村", "era": "石四牌坊主要構件為明代，明萬曆三十七至三十九年（1609—1611）有題記；木四牌坊重建於明萬曆四十一年（1613），清代及民國均有修葺", "found": "兩坊創建年代均不詳；石坊現存題記可將建造活動繫於1609—1611年，木坊有1613年重建記", "level": "第七批全國重點文物保護單位（2013），合併項目「石四牌坊和木四牌坊」，編號7-0890", "status": "部分覈實", "conf": "B", "note": "資料庫原始名稱「木·石四牌坊」實際指兩座分立牌坊：石四牌坊位於舊城南十字街附近，石面題記涉及萬曆三十七年（1609）及三十九年（1611）；木四牌坊位於城內村北，明萬曆四十一年（1613）重建，另有萬曆四十一年重建碑記。兩坊於第七批國保合併公布。原始座標僅保留一組，無法同時精確代表兩處，必須現場分別定位，後續宜拆成兩個獨立地圖點。", "access": "兩座牌坊位於翼城舊城不同街口，為街道公共空間構築物；拍攝與步行須注意車流，勿將兩坊視為同一座建築。", "map": "https://www.google.com/maps/search/?api=1&query=35.72605282,111.70872283", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-23-part-01.md#lf-041"}, {"id": "LF-042", "city": "臨汾市", "name": "四聖宮", "loc": "臨汾市翼城縣曹公村北", "era": "四聖宮正殿及舞樓為元代建築；其餘院落建築多為明清時期", "found": "元至正年間（1341—1370）創建；明清均有修葺", "level": "第六批全國重點文物保護單位（2006），編號6-0417-3-120", "status": "部分覈實", "conf": "A", "note": "位於翼城縣西閻鎮曹公村，因同時供奉堯、舜、禹、湯而得名。元至正年間創建；現存正殿及舞樓為元代建築，其餘多為明清建築。舞樓為研究元代戲曲與廟宇演劇的重要實物。2014年報導修繕完成並稱向遊客開放，但不應據此推定當前開放。原始座標與公開座標接近，仍待現場核實。", "access": "2014年修繕完工報導曾稱向遊客開放；該資訊不能代表目前開放狀態，出發前須向文物管理單位確認。", "map": "https://www.google.com/maps/search/?api=1&query=35.57641799,111.92729816", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-23-part-01.md#lf-042"}, {"id": "LF-043", "city": "臨汾市", "name": "永和文廟大成殿", "loc": "臨汾市永和縣文化廣場北端", "era": "現存大成殿有元代木構斷代說；但第七批國保名錄登錄時代為明，與地方文物資料所述元代建築存在差異，須以正式測繪調查報告再核", "found": "山西文化資源網稱創建於元至元年間（1264—1294）；創建沿革與現存殿堂年代仍須分開理解", "level": "第七批全國重點文物保護單位（2013），編號7-0846-3-144", "status": "部分覈實", "conf": "B", "note": "永和縣城內文廟僅存大成殿，坐北朝南，面闊、進深各五間，單檐歇山頂，採減柱、移柱造。山西文化資源網稱創建於元至元年間，並以元代建築作為研究價值；但第七批國保名錄將其時代登錄為「明」，兩種斷代不可混為一談。本檔保留差異，不直接把元代說當成定論。原始地圖標記寫作文化廣場北端，與文獻所述城內正大街東門巷位置仍須現場核對。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.75805013,110.62847661", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#lf-043"}, {"id": "LF-044", "city": "臨汾市", "name": "掛甲山摩崖造像", "loc": "臨汾市吉縣吉昌鎮橋南村北", "era": "國保名錄時代為北朝至明；造像分期涉及北朝、隋唐及後續補刻，具體龕像年代須逐項辨析", "found": "不適用；摩崖造像為分期開鑿，不應套用單一寺院創建年份", "level": "第八批全國重點文物保護單位（2019），編號8-0481-4-004", "status": "部分覈實", "conf": "A", "note": "掛甲山摩崖造像位於吉縣城南掛甲山，國保項目名稱包括「謝悉坤柔聖母廟」，第八批國保名錄時代登錄為北朝至明。部分地方介紹將開鑿起點繫於隋開皇二年（582），並記唐、宋、金時期續有補刻；這一精確起始年仍應回到造像題記與分龕調查核實，不能以單一概括年份代表全部龕像。聖母廟現存殿堂與摩崖造像須分開斷代。原始座標與崖面、入口位置尚待現場核對。", "access": "位於掛甲山崖面，需核實登山步道、現場管理及文物保護要求；勿攀爬或觸摸造像。", "map": "https://www.google.com/maps/search/?api=1&query=36.09068001,110.67011861", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#lf-044"}, {"id": "YC-001", "city": "運城市", "name": "二郎廟北殿", "loc": "運城市垣曲縣北陽村東", "era": "現存北殿為元代木構遺構；面闊三間、進深四椽、單檐懸山頂", "found": "二郎廟始建年代不詳；勿以元代現存北殿推定寺廟始建年份", "level": "第六批全國重點文物保護單位（2006），編號6-0435-3-138", "status": "部分覈實", "conf": "A", "note": "二郎廟現僅存北殿，國務院第六批國保名錄將其時代列為元。北殿坐北朝南，面闊三間、進深四椽，單檐懸山頂，梁架與斗栱為元代木構特徵。始建年代不詳。原始標記在北陽村東；公開資料中的地圖點與原始經緯度有差異，保留原始座標，不擅自平移。", "access": "位於蒲掌鄉北陽村東，入內及管理狀態未核實；到訪前宜向村級或文物管理單位確認。", "map": "https://www.google.com/maps/search/?api=1&query=35.19499460,112.00363723", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#yc-001"}, {"id": "YC-002", "city": "運城市", "name": "埝堆玉皇廟", "loc": "運城市垣曲縣張家莊村西北", "era": "現存戲台與正殿均為元代遺構；其餘院落建築多已毀或為後期增修", "found": "創建年代不詳；明成化、清康熙四年（1665）、嘉慶二十三年（1818）等有修葺記錄", "level": "第六批全國重點文物保護單位（2006），編號6-0436-3-139", "status": "部分覈實", "conf": "A", "note": "埝堆玉皇廟位於垣曲縣皋落鄉埝堆村（亦見張家莊村埝堆自然村的行政描述），始建年代不詳，現存戲台和正殿均為元代遺構。第六批國保名錄時代列元。公開資料記有明成化、清康熙四年（1665）、嘉慶二十三年（1818）及民國時期修葺；抗戰期間東西耳殿、廂房等受損。最高人民檢察院2019年報導曾指出文物原狀及管理安全問題，不能把舊報導當作目前開放狀態。原始座標與公開地圖點有偏差，保留原值待現場核對。", "access": "曾有文物保護與管理風險報導；到訪前務必確認現場管理、開放與進入許可。", "map": "https://www.google.com/maps/search/?api=1&query=35.28838871,111.68591962", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#yc-002"}, {"id": "YC-003", "city": "運城市", "name": "宋村永興寺", "loc": "運城市垣曲縣宋村東", "era": "山西文化資源網及文物部門報導將現存北殿核心梁架判為金代風格／金代遺構；東耳房、磚塔等有清代建築，院落其餘部分曾改建", "found": "創建年代存在西魏大同四年（538）說；另有文物資料明言創建年代不詳，未核得可直接證明538年的原始碑刻，暫不採為定論", "level": "第七批全國重點文物保護單位（2013），時代著錄金、清", "status": "部分覈實", "conf": "B", "note": "宋村永興寺又名重興寺，位於垣曲縣華峰鄉宋村東南。現存北殿、東耳房、厢房及磚塔等，地方文物資源名錄將其時代列為金、清；北殿梁架多次重修後仍保留金代風格。部分縣級介紹稱寺院創建於西魏大同四年（538），但另有文物部門報導稱創建年代不詳，且目前未取得可直接證明538年的碑刻原文，因此不把該年寫成確證。2016年國家文物局投資啟動保護修繕，工程狀態及現場開放須另核。", "access": "位於華峰鄉宋村東南；2016年曾啟動保護修繕工程，現時開放與修繕後狀態須另行確認。", "map": "https://www.google.com/maps/search/?api=1&query=35.17350813,111.82581957", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#yc-003"}, {"id": "YC-004", "city": "運城市", "name": "董封戲臺", "loc": "運城市絳縣董封村", "era": "明代戲台；明萬曆四十年（1612）重建，清嘉慶四年（1799）增建三面觀抱廈；2001年曾落架大修", "found": "原屬泰山廟附屬戲台，泰山廟始建年代不詳", "level": "第六批全國重點文物保護單位（2006），國保時代為明", "status": "部分覈實", "conf": "A", "note": "董封戲台位於絳縣安峪鎮董封村，原為泰山廟附屬建築，現泰山廟已毀，主要遺存為戲台。山西文化資源網稱整體為明代建築，梁架保留元代建築風格；運城市文物名錄資料記載依梁題記於明萬曆四十年（1612）重建，清嘉慶年間增修，2001年曾由山西省古建所落架大修。應以現存建築年代為明，不因元代風格而改判為元構。原始座標與公開地圖標記略有差距，保留原始座標。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.58081900,111.63765204", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#yc-004"}, {"id": "YC-005", "city": "運城市", "name": "絳縣文廟", "loc": "運城市絳縣", "era": "現存大成殿為明代遺構；明倫堂為清代建築；文廟原有多進院落及附屬建築多已不存", "found": "地方志及碑文傳統記載後唐長興三年（932）創建；屬文廟沿革記載，仍須核對原志、碑刻原文", "level": "第七批全國重點文物保護單位（2013），編號7-0854-3-152；國保名錄時代為明至清", "status": "部分覈實", "conf": "B", "note": "絳縣文廟位於縣城振興西大街文廟路一帶，現為絳縣博物館。地方志及碑文資料傳統稱始建於後唐長興三年（932），歷代重修擴建；原有五進院落，現主要保存明代大成殿與清代明倫堂。第七批國保名錄將整體時代列為明至清，故不能把傳統創建年等同現存大成殿年代。原始地圖標記與文獻地址相近，仍需核對實際入口及博物館開放安排。", "access": "現為絳縣博物館範圍；具體開放時間、入口及展陳安排須以博物館公告為準。", "map": "https://www.google.com/maps/search/?api=1&query=35.48728709,111.56451463", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-yuncheng-batch-24-part-01.md#yc-005"}, {"id": "YC-006", "city": "運城市", "name": "景雲宮玉皇殿", "loc": "運城市絳縣灌底堡村景雲中學內", "era": "現存玉皇殿為元代木構遺構；面闊五間、進深三間，單檐懸山頂，五鋪作雙下昂", "found": "地方縣志記載景雲宮創建於唐貞觀八年（634）；殿前存唐代元始天尊像碑，碑刻紀年亦為貞觀八年。創建沿革與現存元代玉皇殿年代分開記錄", "level": "第六批全國重點文物保護單位（2006），編號6-0433-3-136；國保名錄時代為元", "status": "部分覈實", "conf": "A", "note": "景雲宮位於絳縣橫水鎮東灌底村北景雲中學院內。地方縣志沿革記載始創於唐貞觀八年（634），殿前存唐代元始天尊像碑，碑刻紀年同為貞觀八年；但現存主體僅玉皇殿，為元代建築，國務院第六批國保名錄亦將其時代列為元。1933年火災後宮院其他殿宇大多被毀。玉皇殿面闊五間、進深三間，單檐懸山頂，斗栱五鋪作雙下昂。1984年曾由山西省古建研究所搶救性維修，2009年有國家文物局修繕資金。注意：唐代創建傳統、唐碑年代與現存元代殿堂不是同一個年代概念。原始座標保留，與公開地圖點存在數百米級差異，須現場核位。", "access": "位於景雲中學校園內；需事先聯絡校方及文物管理單位確認是否可入內，勿將校園視作自由開放景點。", "map": "https://www.google.com/maps/search/?api=1&query=35.45361029,111.39905244", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-006"}, {"id": "YC-007", "city": "運城市", "name": "南樊石牌坊", "loc": "運城市絳縣西堡村", "era": "清嘉慶九年（1804）建造；石質仿木構，雙面六柱五門、三重檐，約高12米、寬8.5米", "found": "不適用；為旌表節孝而建的紀念性牌坊及附屬碑亭", "level": "第七批全國重點文物保護單位（2013），編號7-0901-3-199；國保名錄時代為清", "status": "已覈實", "conf": "A", "note": "南樊石牌坊及碑亭位於絳縣南樊鎮西堡村。牌坊建於清嘉慶九年（1804），由賈宗洛奉旨為其祖母李恭人建造節孝牌坊。牌坊為石質仿木構，雙面六柱五門、三重檐，約高12米、寬8.5米；右側附設青石仿木構碑亭，內存石碑15通。1996年列山西省級文物保護單位，2013年列第七批全國重點文物保護單位。官方第七批名錄編號為7-0901-3-199；網路部分資料將編號誤寫為7-0972，已按官方名錄校正。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.60976801,111.60460551", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-007"}, {"id": "YC-008", "city": "運城市", "name": "南柳泰山廟", "loc": "運城市絳縣西南", "era": "現存建築時代跨元至清；正殿、後土殿及聖母殿主體結構為元代，其他殿房多為後期建築", "found": "廟院始建年代不詳；可確認明代及清康熙四十六年（1707）、雍正十三年（1735）、乾隆二十九年（1764）有修繕記載", "level": "第七批全國重點文物保護單位（2013），編號7-0825-3-123；國保名錄時代為元至清", "status": "部分覈實", "conf": "A", "note": "南柳泰山廟位於絳縣南樊鎮南柳村西南約1公里，供奉東嶽天齊仁聖大帝。始建年代不詳，資料記載明代及清康熙四十六年（1707）、雍正十三年（1735）、乾隆二十九年（1764）曾修繕。正殿、後土殿、聖母殿主體結構為元代，正殿面闊三間、進深四椽，單檐懸山頂，斗栱五鋪作雙下昂。山西新聞網報導稱現存建築共9座、時代由元至清；另一些簡介僅列三座主要殿宇，可能是統計口徑不同，不宜將其簡化為僅存三座。2014年啟動本體修繕，2015年完成琉璃脊、木構件、護坡及院面等工程；這些歷史工程資訊不能證明目前已對外開放。", "access": "曾由文物部門管理並完成修繕工程；當前開放、院落管理及入內許可未核實，出發前應向絳縣文物管理部門確認。", "map": "https://www.google.com/maps/search/?api=1&query=35.55865897,111.60554625", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-008"}, {"id": "YC-009", "city": "運城市", "name": "喬寺碑樓", "loc": "運城市絳縣喬寺村", "era": "清道光十七年（1837）建造；石砌台基，樓身六間、單檐歇山頂，碑室及石刻裝飾為主體特色", "found": "不適用；為周氏家族紀念性功德碑樓", "level": "第七批全國重點文物保護單位（2013），編號7-0902-3-200；國保名錄時代為清", "status": "已覈實", "conf": "A", "note": "喬寺碑樓位於絳縣橫水鎮喬寺村，為周氏家族紀念資政大夫周萬鍾所建的功德碑樓，建於清道光十七年（1837）。單體建築坐西朝東，石砌台基約長17米、寬2.6米、高1.5米，樓身約高15米，六間，單檐歇山頂。正面設五個碑室、七通碑，碑序由乙未科探花喬晉芳撰寫；柱間石雕對聯、石匾額及仿木斗栱磚雕具有較高藝術價值。1996年列山西省第三批省級文物保護單位，2013年列第七批全國重點文物保護單位。官方名錄編號7-0902-3-200。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.45831892,111.43490159", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-009"}, {"id": "YC-010", "city": "運城市", "name": "長春觀", "loc": "運城市絳縣東荊下村", "era": "混元寶殿為元代遺構；東配殿為明代；獻殿、廊房等為清代或後期建築", "found": "殿內題記記元延祐七年（1320）始建；地方文物資料據此記為道觀創建年代", "level": "第七批全國重點文物保護單位（2013），編號7-0817-3-115；國保名錄時代為元至清", "status": "部分覈實", "conf": "A", "note": "長春觀位於絳縣陳村鎮東荊下村，坐北朝南，現存一進院落。混元寶殿面闊三間、進深四椽，單檐懸山頂，前檐斗栱五鋪作雙下昂，殿內有元延祐七年（1320）始建題記。混元寶殿為元代建築，東配殿為明代，其餘建築多為清代，國保名錄時代列元至清。地方資料稱道觀曾改為村辦學校，2009年山西省文物局曾撥款全面維修；現況與開放狀態未核實。", "access": "曾改作村辦學校，2009年曾獲專款全面維修；目前是否開放及管理方未核實，須出發前確認。", "map": "https://www.google.com/maps/search/?api=1&query=35.48863773,111.62774862", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-010"}, {"id": "YC-011", "city": "運城市", "name": "郭家莊仇氏石牌坊及碑亭", "loc": "運城市聞喜縣郭家莊村", "era": "清同治、光緒年間（1862—1908）陸續建造；由1座石牌坊、5座石碑亭及1通石碑組成", "found": "不適用；為仇氏家族旌表、神道及德行紀念建築群", "level": "第七批全國重點文物保護單位（2013），編號7-0903-3-201；國保名錄時代為清", "status": "已覈實", "conf": "A", "note": "郭家莊仇氏石牌坊及碑亭位於聞喜縣郭家莊鎮郭家莊村口道路兩旁，沿南北向道路分布約130米。建築群由一座石牌坊、五座碑亭及一通石碑構成，均為清同治、光緒年間（1862—1908）所建。石牌坊坐北朝南，六柱五門、三重檐歇山頂，高約15米；五座碑亭分別為仇毓鏡神道碑亭、仇氏三兄弟德行碑亭、仇氏五碑碑亭、趙太君德壽碑亭、薛太君節孝碑亭。石構仿木建築，使用陰刻、線刻、浮雕、鏤雕及雙面雕等技法。2013年列第七批全國重點文物保護單位，官方名錄編號7-0903-3-201。人民日報2023年報導亦確認建築群由五座碑樓、一座牌坊及一通石碑組成。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.30251975,111.16225144", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-011"}, {"id": "YC-012", "city": "運城市", "name": "后稷廟", "loc": "運城市聞喜吳呂村", "era": "現存水陸殿（後稷殿）為元代木構遺構，門墩石有元至元二十九年（1292）五月題記；戲台經明清重修，亦有後期修繕", "found": "創建年代資料有分歧：部分建築調查資料稱梁板墨書「大元至元元年（1264）創建」；另有資料稱始建年代無考，2025年戲台研究文章亦採1264年始建、1292年擴建說。須核對原始題記照片與釋文後再作定論", "level": "第六批全國重點文物保護單位（2006），編號6-0421-3-124；國保名錄時代為元至明", "status": "部分覈實", "conf": "B", "note": "吳呂后稷廟位於聞喜縣陽隅鎮吳呂村，祭祀后稷。國保名錄將其時代列為元至明，第六批編號6-0421-3-124。現存核心建築為水陸殿（亦稱後稷殿）與戲台，水陸殿坐東朝西，面闊三間、進深四椽，單檐懸山頂；門墩石有元至元二十九年（1292）五月題記。另有建築資料記載梁板墨書「大元至元元年（1264）創建」，2025年戲台研究文章亦稱1264年始建、1292年擴建；但國保資料及其他簡介仍有「創建年代無考」說。應把1264年梁板墨書、1292年門墩題記及後世修繕分開核對，未取得原始題記影像前，不將創建年份視為完全定論。明嘉靖、清乾隆年間有重修記錄，2011年曾修繕水陸殿與戲台，2014年復建配殿、耳殿等。", "access": "位於聞喜縣陽隅鎮吳呂村；文物曾修繕並復建部分附屬建築，現場管理及對外開放安排須出發前核實。", "map": "https://www.google.com/maps/search/?api=1&query=35.40328368,111.05652003", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-25-part-01.md#yc-012"}, {"id": "YC-013", "city": "運城市", "name": "白臺寺", "loc": "運城市新絳縣光馬村西南", "era": "寺院創建年代不詳；唐開元十四年（726）有重修碑記；現存釋迦殿為金代、法藏閣及後大殿為元代，東耳房與西廂房為明清", "found": "創建年代不詳；唐開元十四年（726）重修記載，不等於始建年代", "level": "第六批全國重點文物保護單位（2006），編號 6-0372-3-075；國保名錄時代標註「金至清」", "status": "部分覈實", "conf": "A", "note": "白台寺又名普化寺。唐開元十四年（726）碑記證明當時重修，不能據此推定始建於唐；現存核心為金、元建築：釋迦殿金代，三滴法藏閣及後大殿元代。寺內另存唐代造像幢、北宋經幢及元明彩塑。2025年研究重新討論大雄寶殿栱眼壁五幅佛傳壁畫的年代與內容，勿未經論證一概定為明代。原始地圖標記及座標未作現場校正。", "access": "原始座標保留；寺院入口、管理及當日開放情況出發前核實", "map": "https://www.google.com/maps/search/?api=1&query=35.66384081,111.06948589", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-013"}, {"id": "YC-014", "city": "運城市", "name": "北池稷王廟", "loc": "運城市新絳縣北池村", "era": "明至清；正殿及戲台為明代建築，其餘主要建築為清代", "found": "據正殿脊枋題記，明弘治十六年（1503）創建；後世多次重修、擴建", "level": "第七批全國重點文物保護單位（2013），編號 7-0888-3-186；國保名錄時代標註「明至清」", "status": "部分覈實", "conf": "B", "note": "北池稷王廟位於新絳縣陽王鎮北池村。地方文物資料稱正殿脊枋有明弘治十六年（1503）創建題記；現存正殿與戲台為明代，其餘建築為清代。第七批國保名錄明確列為「明至清」，編號 7-0888-3-186。勿將陽王村稷益廟與北池村稷王廟混為一處。原始座標未經現場核對。", "access": "村落廟宇；現場入口、管理及當日開放情況待核實", "map": "https://www.google.com/maps/search/?api=1&query=35.48864628,111.04061338", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-014"}, {"id": "YC-015", "city": "運城市", "name": "福勝寺(暫停開放)", "loc": "運城市新絳縣光村西北", "era": "北齊至元、明；現存主要建築包含元代遺構，寺內彩塑有元、明作品", "found": "近年新絳縣文旅部門資料稱肇建於北齊天統年間（565—569）；較早資料另有唐貞觀年間始建說，須保留文獻差異", "level": "第五批全國重點文物保護單位（2001），編號 5-272；名錄時代標註「元、明」", "status": "部分覈實", "conf": "A", "note": "福勝寺位於新絳縣澤掌鎮光村。新近縣級文旅部門公開徵集公告及2026年新聞稱寺院肇建於北齊天統年間（565—569）；2014年新華社報道曾記唐貞觀年間始建，兩種說法不宜悄然合併。現存主要建築有元代遺構，彌陀殿保存元代減柱造形制，寺內另有元、明彩塑及懸塑。三佛洞位於後大殿底層，2026年6月正式對外開放；不代表所有殿區及參觀安排均無限制。原始座標保留，未現場校正。", "access": "原始資料曾標記暫停開放；2026年6月三佛洞正式對外開放，整寺及其他區域當日開放安排仍須核實", "map": "https://www.google.com/maps/search/?api=1&query=35.75265636,111.16806541", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-015"}, {"id": "YC-016", "city": "運城市", "name": "稷益廟(暫停開放)", "loc": "運城市新絳縣陽王村政府院內", "era": "元代重修記錄；現存主體為明清遺構，正殿及戲台為明代建築，壁畫完成於明正德二年（1507）", "found": "創建年代不詳；明嘉靖二年（1523）重修碑追述元至元年間重修，非創建紀年", "level": "第五批全國重點文物保護單位（2001），編號 5-273；國保名錄時代標註「明」", "status": "部分覈實", "conf": "A", "note": "稷益廟位於新絳縣陽王鎮陽王村，祀奉后稷、伯益。創建年代不詳；明嘉靖二年（1523）《重修東嶽稷益廟碑》記元至元年間重修，明弘治、正德年間擴建。現存正殿及戲台為明代建築，正殿壁畫完成於明正德二年（1507），據研究約130平方米，描繪三皇、大禹、后稷、伯益及農耕生產場景。勿將元代重修記錄寫成元代始建。原始資料標記暫停開放，現況須另核。", "access": "原始資料標記暫停開放；目前是否仍限制進入及是否需預約，出發前向管理單位核實", "map": "https://www.google.com/maps/search/?api=1&query=35.50654698,111.11499341", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-016"}, {"id": "YC-017", "city": "運城市", "name": "絳州大堂", "loc": "運城市新絳縣", "era": "現存大堂為元代重建遺構；殿下部分柱礎有唐代遺存", "found": "地方文獻及近年官方報道稱始建於唐代；現存大堂為元代重建，不能把唐代創建等同現存木構年代", "level": "第四批全國重點文物保護單位（1996），編號 4-117（現行細編號常見 4-0117-3-039）", "status": "部分覈實", "conf": "A", "note": "絳州大堂是舊絳州署處理政務的主要公堂。官方地方報道稱始建於唐代，現存主體為元代重建遺構；面闊七間、進深八椽，單檐懸山頂，採減柱造，堂內空間開闊，柱礎保留唐代覆盆蓮花式遺存。1996年列第四批全國重點文物保護單位，名錄年代為元。須區分唐代創建沿革與元代現存大堂。原始座標保留，與現代景區入口位置可能有偏差。", "access": "位於絳州署景區範圍；當日開放、票務及入內安排出發前核實", "map": "https://www.google.com/maps/search/?api=1&query=35.61430158,111.21507870", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-017"}, {"id": "YC-018", "city": "運城市", "name": "絳州三樓（鼓樓）", "loc": "運城市新絳縣", "era": "鐘樓、鼓樓、樂樓分別有宋、元、明創建沿革；現存木構均經明清重修，主體多見明代遺構", "found": "鐘樓傳北宋乾德元年（963）創建；鼓樓傳元至正年間（1341—1370）；樂樓傳明洪武年間（1368—1398）", "level": "作為「絳州大堂」相關建築群一部分納入第四批全國重點文物保護單位；不宜將三樓誤寫成單獨同名國保項目", "status": "部分覈實", "conf": "B", "note": "絳州三樓是鐘樓、鼓樓、樂樓的合稱，三樓分布於絳州署大堂附近高垣及坡地，功能分別與報時、城市管理及戲曲活動相關。地方志及地方文物資料所載創建沿革分別為鐘樓北宋乾德元年（963）、鼓樓元至正年間（1341—1370）、樂樓明洪武年間（1368—1398）；現存木構均經後世重修，不能把創建傳說直接當作現存構件年代。保護名錄中應與「絳州大堂」相關合併項目理解，勿重複計為獨立國保單位。原始座標是三樓群的概略標記，需逐樓現場核對。", "access": "位於絳州署景區周邊；各樓能否登臨及當日開放範圍須現場核實", "map": "https://www.google.com/maps/search/?api=1&query=35.61307395,111.21606738", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-018"}, {"id": "YC-019", "city": "運城市", "name": "樂樓", "loc": "", "era": "明代遺構；1983年曾作搶救性維修", "found": "地方資料稱創建於明洪武年間（1368—1398），精確建成年份未核實", "level": "屬絳州三樓（與絳州大堂相關保護項目）中的樂樓；未查得其作為獨立國保項目的證據", "status": "部分覈實", "conf": "B", "note": "本點位是絳州三樓中的樂樓，不是另一處獨立戲台。地方資料稱創建於明洪武年間（1368—1398），現存建築為明代遺構，1983年曾作搶救性維修。建築坐南朝北，面闊三間、進深二間，前檐插廊，硬山筒瓦頂；北側七星坡與觀演空間構成其城市公共文化場景。其文物保護歸屬應隨絳州大堂／絳州三樓相關項目理解，不另計一處國保。原始地圖點需與實際樂樓位置現場比對。", "access": "戲樓外觀可否近觀及是否受景區管理限制，出發前核實", "map": "https://www.google.com/maps/search/?api=1&query=35.61245075,111.21615064", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-26-part-01.md#yc-019"}, {"id": "YC-020", "city": "運城市", "name": "鐘樓", "loc": "", "era": "現存鐘樓樓體為明萬曆年間遺構，清代及1979、1994年有修葺；樓內金代鐵鐘鑄於金天德三年（1151）", "found": "地方志稱北宋乾德元年（963）創建，後曾焚毀重建；963年為沿革記載，非現存樓體年代", "level": "第五批全國重點文物保護單位合併項目「絳州三樓」，2001年歸入第四批「絳州大堂」保護項目；不另列獨立國保編號", "status": "部分覈實", "conf": "A", "note": "絳州三樓之一，位於南側高垣。鐘樓創建沿革、現存樓體和懸鐘分屬不同年代：地方志載北宋乾德元年（963）創建，現存樓體為明萬曆遺構，樓內金代鐵鐘鑄於1151年。樓體平面近方形，單檐十字歇山頂，台基高聳，四面設洞門。三樓作為絳州署附屬建築群理解；2001年第五批將「絳州三樓」歸入既有「絳州大堂」國保項目，不應另計一處獨立國保。原始座標保留，需現場核對樓體與地圖標記。參考：[運城長安網／運城新聞（2021）](https://www.ycpeace.gov.cn/a/wenyuan/biaolihedong/20210721/22844.html)；[人民網山西（2023）](https://sx.people.com.cn/n2/2023/0621/c189153-40466629.html)；[第五批國保合併項目通知](https://www.jxsybwg.com/nd.jsp?id=145)", "access": "屬絳州署景區歷史建築群；樓體是否可登、鐘樓內部是否開放，須以現場管理安排為準", "map": "https://www.google.com/maps/search/?api=1&query=35.61217550,111.21560048", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-020"}, {"id": "YC-021", "city": "運城市", "name": "絳州文廟", "loc": "運城市新絳縣", "era": "現存大成殿具明代建築特徵；脊枋有明正德十三年（1518）重修題記；廟內另存宋天聖及清雍正碑刻", "found": "創建年代不詳；舊志及廟內石碣記載宋咸平二年（999）、元、明均曾重修，不能據此斷定始建於宋", "level": "第七批全國重點文物保護單位（2013），編號7-0887-3-185；名錄時代「明至清」", "status": "部分覈實", "conf": "A", "note": "絳州文廟坐北朝南，舊址規模約南北146.2米、東西50.3米。中軸線由影壁、泮池、欞星門至大成殿，東西兩側設廂房。大成殿面闊五間、進深四間，帶周圍廊，重檐歇山頂；上檐斗栱七踩三昂，殿內採減柱造，僅用四根中柱。創建年代不詳；999年是舊志所記重修，不是始建證據。脊枋1518年題記可作明代修繕的實物紀年。第七批國保名錄列「明至清」，編號7-0887-3-185。參考：[山西文物局資料轉載／絳州文廟建築調查](https://www.iwenbo.fun/heritage/3438.html)；[第七批國保名錄](https://zh.wikisource.org/wiki/國務院關於核定並公布第七批全國重點文物保護單位的通知)；[新絳文物概況](https://www.sxwhzyw.cn/pd522472358.html)", "access": "位於新絳縣城四府街105號；當前開放、院落管理及殿內參觀安排未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.61752865,111.22467530", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-021"}, {"id": "YC-022", "city": "運城市", "name": "龍香關帝廟", "loc": "運城市新絳縣龍香村", "era": "正殿為元代木構遺構；戲台梁脊板有清道光十一年（1831）合村創建題記；獻殿為民國三十七年（1948）建築", "found": "始建年代不詳；元、明、清均有重修。部分較早簡介稱宋代創建，但較新的文物調查報導未提供可核實的宋代始建實物證據", "level": "第六批全國重點文物保護單位（2006），編號6-0425；名錄時代「元至民國」", "status": "部分覈實", "conf": "A", "note": "龍香關帝廟位於新絳縣龍香村，坐北朝南，南北長約65.5米、東西寬約35米。現存戲台、獻殿、正殿三座主體建築。正殿面闊三間、進深四椽，單檐懸山頂，柱頭四鋪作單下昂，殿內採減柱法；木柱上有盤龍彩塑，殿內另存關羽及侍從、文臣武將彩塑七尊，造像年代晚於殿堂木構，不能將彩塑直接定為元代。戲台梁脊板題記明確記清道光十一年（1831）三月十二日合村創建；獻殿為民國三十七年（1948）。較早網路介紹曾稱宋代始建，2025年地方報導則稱始建年代不詳，故不採宋代創建說作定論。2025年6月僅有三日臨時開放公告，不能推定目前開放。參考：[國務院第六批國保名錄](https://www.neac.gov.cn/seac/xxgk/200606/1073187.shtml)；[運城新聞／新浪財經（2025）](https://finance.sina.com.cn/roll/2025-09-11/doc-infqawwh6851801.shtml)；[新絳文旅臨時開放通告（2025）](https://www.sohu.com/a/903183428_121123838)", "access": "2025年6月13—15日曾列入新絳縣臨時開放名單；此為限期開放公告，不代表目前常態開放", "map": "https://www.google.com/maps/search/?api=1&query=35.68428226,111.28754240", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-022"}, {"id": "YC-023", "city": "運城市", "name": "喬溝頭玉皇廟", "loc": "運城市新絳縣喬溝頭村西", "era": "現存大殿為元代遺構；連三戲台中部已拆，現存戲台部分含明代遺構；馬王殿保存清代壁畫", "found": "始創年代無確切實物可考；縣志據碑文稱唐代創建，但2022年專題研究指出缺乏可直接證明的始建實物；明嘉靖三十四年（1555）地震後，嘉靖四十一年（1562）集資重修", "level": "第六批全國重點文物保護單位（2006），編號6-0415；名錄時代「元至清」", "status": "部分覈實", "conf": "A", "note": "喬溝頭玉皇廟位於澤掌鎮喬溝頭村西，坐北朝南。2022年冯燕專題調查指出，現存梁架、斗栱、用材與題記可辨元、明、清多期建築資訊；大殿為元代遺構，面闊三間、進深四椽、單檐懸山頂。廟內曾有連三戲台，中舞台已拆；馬王殿東西牆保存清代壁畫約17平方米，另有清光緒演出題記。縣志稱據碑文可追溯唐代創建，但專題研究明確指出始創年代缺乏確切實物稽考，因此應標為「傳稱唐創建、未證」，而不是確定唐代建築。明嘉靖三十四年（1555）地震破壞、嘉靖四十一年（1562）重修亦屬後續沿革。第六批國保名錄列元至清。參考：[冯燕《新絳喬溝頭玉皇廟調查與研究》（2022）](https://www.fx361.com/page/2022/0329/10208287.shtml)；[第六批國保名錄](https://www.bkso.baidu.com/item/第六批全国重点文物保护单位/0)；[山西文化資源網新絳縣名錄](https://www.sxwhzyw.cn/pd522472358.html)", "access": "村西側田地與村落交界；未查到可確認當前常態開放的公告，需先聯絡管理方", "map": "https://www.google.com/maps/search/?api=1&query=35.77136760,111.15770909", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-023"}, {"id": "YC-024", "city": "運城市", "name": "泉掌關帝廟", "loc": "運城市新絳縣泉掌村", "era": "現存核心為正殿，面闊、進深各五間，重檐歇山頂，四周設副階；明代建築，歷經明清多次修葺", "found": "創建年代不詳；梁脊板及石刻記載明弘治八年（1495）、弘治十年（1497）、嘉靖二十六年（1547）、雍正八年（1730）、雍正九年（1731）、乾隆五年（1740）修葺", "level": "第七批全國重點文物保護單位（2013），編號7-0847-3-145；名錄時代「明」", "status": "部分覈實", "conf": "A", "note": "泉掌關帝廟位於泉掌村中心偏西北，現僅存正殿。正殿坐北朝南，建於約0.9米高磚石台基，面闊、進深各五間，平面近方形，重檐歇山頂，正身三間，四周設副階；上檐斗栱五踩雙下昂，下檐斗栱三踩單翹。創建年代不詳。梁脊板及石刻可見1495、1497、1547、1730、1731、1740年修葺紀錄。部分網路簡介將其稱作元代始建或元代大殿，但第七批國保名錄將保護時代列為「明」，應以名錄與現存構件調查為基礎，不把後世修葺紀年誤作創建年份。2025年6月13—15日曾限期臨時開放，非長期開放承諾。參考：[第七批國保名錄](https://zh.wikisource.org/wiki/國務院關於核定並公布第七批全國重點文物保護單位的通知)；[《運城市全國重點文物保護單位通覽》資料摘錄](https://www.sohu.com/a/314816797_340293)；[新絳文旅臨時開放通告（2025）](https://www.sohu.com/a/903183428_121123838)", "access": "2025年6月13—15日曾列入新絳縣臨時開放名單；目前常態開放及殿內進入安排未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.65771724,111.08489019", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-024"}, {"id": "YC-025", "city": "運城市", "name": "三官廟", "loc": "運城市新絳縣韓家巷", "era": "現存正殿為元代木構；獻殿為清代建築；殿內保存元代道教彩塑，專業調查記錄15身", "found": "元至正元年（1341）彩塑主像胸內木柱墨書紀年；此紀年直接證明造像／相關營建年代，常見資料據此推定廟宇始建，但仍應與建築本體年代分開表述", "level": "第六批全國重點文物保護單位（2006），編號6-0443；名錄時代「元」", "status": "部分覈實", "conf": "A", "note": "三官廟俗稱葫蘆廟，坐東朝西，現存正殿與獻殿緊密相連。正殿面闊二間、進深三間，單檐懸山頂；獻殿屋頂為十字歇山頂，建築形制特殊。2015年太原市文物考古研究所劉俊的彩塑病害調查記錄：現存正殿為元代、獻殿為清代，保存元代彩塑15身；其中一尊彩塑胸內主杆有「元至正元年（1341）」墨書。故不宜把現存兩殿一概定為元代，也不宜把彩塑數量在不同來源間的11身／15身差異視作已解決；本檔以專業調查的15身為主，註明統計口徑可能不同。該文強調彩塑有斷裂、起甲、酥鹼、脫落等病害，參觀時不可觸摸或使用閃光燈。參考：[劉俊《新絳三官廟彩塑病害調查》（2015）](https://www.fx361.com/page/2015/0926/16157793.shtml)；[國務院第六批國保名錄](https://www.neac.gov.cn/seac/xxgk/200606/1073187.shtml)；[運城市全國重點文物保護單位通覽摘錄](https://k.sina.cn/article_2769582141_a514783d00100o2wb.html)", "access": "位於新絳縣城韓家巷西口；街巷院落的管理、預約與室內參觀安排未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.61347201,111.22039469", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-025"}, {"id": "YC-026", "city": "運城市", "name": "新絳龍興寺", "loc": "運城市新絳縣", "era": "現存大雄寶殿為元代木構，殿內7尊元代彩塑；龍興塔現存形制為清代重修後的13級八角樓閣式磚塔；寺內另有唐代至民國碑刻", "found": "據1928年《新絳縣志》及後續研究，寺院沿革可追溯初唐，原名碧落觀；唐咸亨元年（670）改稱龍興宮，宋代以後稱龍興寺。此為寺院沿革，不代表現存大雄寶殿或龍興塔建於唐代", "level": "第六批全國重點文物保護單位（2006），編號6-0427；名錄時代「元至清」", "status": "部分覈實", "conf": "A", "note": "新絳龍興寺位於縣城北街高垣，寺院坐北朝南。山西省古建築與彩塑壁畫保護研究院簡莉2022年研究記錄，現存文物建築包括元代大雄寶殿、清代龍興塔及民國時期廂房、碑廊等；大雄寶殿內保存7尊元代彩塑，殿內另有民國水墨壁畫。大雄寶殿面闊五間、進深三間，單檐懸山頂，斗栱五鋪作雙下昂。龍興塔為13級八角樓閣式磚塔，現存塔體屬清代重修後形制；地方資料記載原塔曾於乾隆四十九年（1784）坍塌後重建，不能簡單把現塔稱為唐塔。碧落碑是唐代篆書名碑，研究資料記載原碑與後世重刊碑的遷置、重刻歷史複雜；其現場展示位置應另核，不能把碑刻年代等同寺內現存木構年代。寺院初唐創建、670年改稱龍興宮等屬歷史沿革。參考：[簡莉《新絳龍興寺歷史沿革與建築特徵探析》（2022），作者單位為山西省古建築與彩塑壁畫保護研究院](https://www.fx361.com/page/2022/0208/17762174.shtml)；[國務院第六批國保名錄](https://www.neac.gov.cn/seac/xxgk/200606/1073187.shtml)；[新華社2014年修繕報導](https://news.sohu.com/20141011/n405002659.shtml)；[碧落碑研究資料](https://ygx.sxu.edu.cn/db/學位/D01583177.pdf)", "access": "位於新絳縣龍興路北端高垣；曾有保護修繕工程，當前開放時間及碧落碑展示位置需出發前向管理方確認", "map": "https://www.google.com/maps/search/?api=1&query=35.61837797,111.21964951", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-27-part-01.md#yc-026"}, {"id": "YC-027", "city": "運城市", "name": "新絳壽聖寺大殿", "loc": "運城市新絳縣北蘇村", "era": "現存僅存元代大殿；面闊五間、進深六椽，單檐懸山頂，殿內減柱造", "found": "地方資料稱北宋建隆二年（961）創建，歷代修葺；961年屬寺院沿革記載，現存大殿為元代，不得將始建年套用於木構", "level": "第八批全國重點文物保護單位，編號8-0213-3-016，名錄時代「元」", "status": "部分覈實", "conf": "A", "note": "原始座標保留。官方第八批國保名錄列「新絳壽聖寺大殿」，編號8-0213-3-016，時代元。寺院創建沿革常見記為北宋建隆二年（961），但現存僅元代大殿一座，不能把961年當作現存大殿年代。大殿面闊五間、進深六椽，單檐懸山頂，建築面積約250平方米；檐下斗栱四鋪作單下昂，補間一朵；殿內採減柱造，後槽施大內額，梁架為六椽栿對前乳栿通檐用三柱，梁架彩繪可見蛟龍圖案。其價值在於晉南元代木構的梁架與空間處理，殿宇單體保存，適合觀察木構本體而非大型寺院格局。來源對殿內平面描述有「進深三間」與「進深六椽」不同口徑，本文保留六椽的結構描述，不將椽架數誤作開間數。參考：[第八批國保名錄（政府網站）](https://www.forestry.gov.cn/main/4815/20191016/173000319923859.html)；[壽聖寺大殿資料](https://www.iwenbo.fun/heritage/4838.html)；[2024年建築資料整理](https://xlhc.net/7821.html)。", "access": "新絳縣澤掌鎮北蘇村村中；現場入口、是否有人看護及殿內開放須向村委或文保管理方確認", "map": "https://www.google.com/maps/search/?api=1&query=35.74944701,111.18205173", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-027"}, {"id": "YC-028", "city": "運城市", "name": "北陽城磚塔", "loc": "運城市稷山縣北陽城村委會北", "era": "北宋磚塔；方形七級密檐式實心磚塔（現存層數及通高的公開記錄互有出入），塔身逐層收分、叠澀出檐", "found": "北宋寶元二年（1039）；塔基／佛龕相關題記記村民解武為母祈福建塔", "level": "第七批全國重點文物保護單位，編號7-0769-3-067，名錄時代「宋」", "status": "部分覈實", "conf": "A", "note": "北陽城磚塔位於稷山縣清河鎮北陽城村中部。塔基題記紀年北宋寶元二年（1039），並記村民解武為母祈福建塔，是其年代與建塔緣由的重要直接線索。塔為方形磚砌實心密檐塔，塔身素面，逐層收分，以叠澀法出檐，南面下部開佛龕，內嵌砂石坐佛，佛首已毀。它不是可登臨的樓閣式塔，而是尺度小、結構實心的村落祈福塔。公開資料對現狀層數、高度有差異：有資料記七級、約8.1米；另有資料記外露八層、約10米；早期簡介亦見約5米。應視為測量口徑、層級計算或不同時期記錄差異，未經現場測量不擇一作定論。2013年列第七批國保，編號7-0769-3-067。參考：[稷山文化遺產報導（含塔基題記及形制）](https://news.xinmin.cn/2022/12/27/32288264.html)；[第七批國保條目及參考資料](https://zh.wikipedia.org/wiki/北阳城砖塔)；[2026年運城晚報轉載資料](https://www.sohu.com/a/1047617012_121106991)。", "access": "稷山縣清河鎮北陽城村中部；屬村落內小型文物，是否可近距離觀看及塔基周邊通行需尊重村民與管理要求", "map": "https://www.google.com/maps/search/?api=1&query=35.52370036,111.05597419", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-028"}, {"id": "YC-029", "city": "運城市", "name": "稷山大佛", "loc": "運城市稷山縣寺後窯村東南", "era": "大佛為金代依黃土崖體雕塑、下部土雕上身泥塑並施彩；現存寺院多為2004年前後重建或仿元式新建建築，不能將寺院現存殿宇一概定為金代", "found": "大佛寺（原清涼院、又名佛閣寺）據寺內碑文始建於金皇統二年（1142）；元大德十一年（1307）、至正十四年（1354）、清康熙二十年（1681）、咸豐九年（1859）、民國五年（1916）及2004年均有修葺", "level": "第七批全國重點文物保護單位名錄中的「稷山大佛」，編號7-2139-6-001，類別其他，時代金、元；注意此為大佛文物項目，不宜直接等同整座寺院建築群", "status": "部分覈實", "conf": "A", "note": "本點原始座標與公開資料所指寺後窯村東南的大佛寺位置相符。大佛寺原名清涼院，又名佛閣寺，據寺內碑文始建於金皇統二年（1142）。寺內核心文物是依黃土高塬／土崖雕塑的大佛：下部以土崖雕成，上身泥塑並施彩，右手作說法印，左手扶膝。不同來源對高度有16.68米、20米以上等差異，可能涉及測量範圍或含座方式；不宜簡單宣稱精確20米。大佛的年代資料指向金代，另有元代十王洞泥塑等遺存。寺院曾於1307、1354、1681、1859、1916及2004年修葺；現存寺院多數殿宇為後期重建或仿古建築，不能將其整體說成金代木構。第七批國保項目「稷山大佛」編號7-2139-6-001，名錄類別為其他、時代金元；這一項目名稱指向大佛文物本體，與寺院建築群的保護範圍需區分。參考：[第七批國保資料條目](https://www.iwenbo.fun/heritage/4619.html)；[澎湃政務：大佛寺碑記、寺院沿革及元代泥塑](https://www.thepaper.cn/newsDetail_forward_8725400)；[新華網／黃河新聞2024年實地報導](https://www.xinhuanet.com/ci/20240808/7ae9e0eaf1dc4edabcb7da88acf9cb6f/c.html)。", "access": "寺後窯村東南大佛寺內；寺院及大佛殿參觀安排需以現場管理方公告為準，勿假設所有洞窟或殿堂均開放", "map": "https://www.google.com/maps/search/?api=1&query=35.61589294,110.97951827", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-029"}, {"id": "YC-030", "city": "運城市", "name": "稷山稷王廟", "loc": "運城市稷山縣", "era": "現存過亭、姜嫄殿及東西垛殿主體結構為元代；其餘主要建築多為清代增建或重修", "found": "據康熙四十七年《平陽府志》及現存碑文，元至正五年（1345）創建；明隆慶元年（1567）由稷王山遷至今縣城位置；清道光二十三年（1843）、光緒十七年（1891）增建修葺", "level": "第六批全國重點文物保護單位，編號6-0430-3-133，名錄時代「元至清」", "status": "部分覈實", "conf": "A", "note": "稷山稷王廟又稱後稷祠，奉祀農業始祖后稷。需注意它與萬榮縣太趙村的「萬榮稷王廟」（北宋木構）不是同一處。稷山稷王廟原在縣城以南約50華里的稷王山，明隆慶元年（1567）遷至今址。據康熙四十七年《平陽府志》及現存碑文，廟創建於元至正五年（1345）；道光二十三年（1843）、光緒十七年（1891）續有增建修葺。現存過亭、姜嫄殿及東西垛殿主體結構為元代，其餘建築多為清代。寺廟坐北朝南，二進院落，約南北104米、東西87米；中軸線由山門、獻殿、後稷樓、泮池、過亭至姜嫄殿。琉璃、木刻、石雕合稱「三絕」，並存碑刻、石碣及石獅。2006年第六批國保，編號6-0430-3-133。參考：[澎湃政務：稷山稷王廟沿革、建築分期及藝術特色](https://www.thepaper.cn/newsDetail_forward_8619148)；[第六批國保名錄（文化和旅遊部政府資訊公開）](https://zwgk.mct.gov.cn/zfxxgkml/qt/202012/t20201206_918486.html)；[新華社2026年報導（辨別稷山與萬榮兩座稷王廟）](https://www.xinhuanet.com/20261016/fec1022f39dd4fb89591a4b0f32ee2d2/c.html)。", "access": "稷山縣稷峰鎮西北街村東南、縣城內；當前開放時間、祭祀活動及殿內參觀規定需另核", "map": "https://www.google.com/maps/search/?api=1&query=35.60139478,110.97266326", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-030"}, {"id": "YC-031", "city": "運城市", "name": "馬村磚雕墓", "loc": "運城市稷山縣", "era": "宋、金時期段氏家族墓地；地下墓室以仿木構磚雕、彩繪及局部壁畫構成，並非地上木構建築", "found": "墓群主要年代約北宋政和八年（1118）至金大定二十一年（1181）；《段楫預修墓記》及墓葬形制是分期依據，並非所有墓葬同一年建造", "level": "第五批全國重點文物保護單位，編號5-0153-2-009，名錄時代「宋、金」", "status": "部分覈實", "conf": "A", "note": "馬村磚雕墓是宋金時期稷山段氏家族墓地，並非單一墓室。公開資料記共發現14座、已發掘9座；墓葬年代依《段楫預修墓記》與形制判斷，屬金大定以前，概括時段常列北宋政和八年（1118）至金大定二十一年（1181）。墓室多為夫妻合葬，墓道有斜坡、階梯、竪穴等形式，墓室多作長方或方形覆斗頂。最具特色的是仿木構磚雕門樓、柱額枋、斗栱、門窗、勾欄及四合院式室內空間；部分墓室還刻有墓主夫婦、侍從、二十四孝、開芳宴及戲曲樂舞場景，兼具建築史、雕刻史、戲劇史和宋金社會生活史價值。山西文化資源網記載部分墓出土北宋銅錢、瓷器，4號墓有二十四孝立體磚雕。第五批國保編號5-0153-2-009。原始CSV座標與國保資料所列位置大致接近，但景區地圖資料另有偏移約數百米；本次不改動原座標，現場應核對入口與博物館位置。參考：[山西文化資源網：馬村磚雕墓](https://www.sxwhzyw.cn/pd512016758.html)；[第五批國保資料及墓群描述](https://www.iwenbo.fun/heritage/916.html)；[澎湃／國際在線2024年實地調研](https://m.thepaper.cn/newsDetail_forward_29353143)；[中國國家地理2024年墓室與開放情況報導](https://www.dili360.com/cng/mag/detail/962.htm)。", "access": "稷山縣城西約2.5公里馬村，現有墓室並非全部對外開放；有資料稱探明14座、發掘9座，開放墓室數量隨管理安排變化，出發前須確認", "map": "https://www.google.com/maps/search/?api=1&query=35.58742046,110.92057500", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-031"}, {"id": "YC-032", "city": "運城市", "name": "南陽法王廟", "loc": "運城市稷山縣南陽村西", "era": "現存建築跨元、明、清；正殿為法王殿，面闊五間、進深兩間、單檐懸山頂，前有抱廈；舞亭為明代建築，十字歇山頂", "found": "創建年代不詳；依建築形制推測不晚於元代，部分舊資料稱元代重建。明成化七年（1471）有《法王廟創建舞庭記》，弘治十五年（1502）、萬曆三十六年（1608）有重修碑，清嘉慶二十一年（1816）亦有修繕記錄", "level": "第七批全國重點文物保護單位，編號7-0832-3-130，名錄時代「元、明至清」", "status": "部分覈實", "conf": "A", "note": "南陽法王廟全稱玄天上帝法王之廟，坐西朝東，一進院布局，東西約68.3米、南北約46米。創建年代不詳，依現存建築形制推測不晚於元代；一些早期介紹稱元代重建，但未找到可直接證明始建或重建年份的元代原始題記，故不將其寫成確定年代。廟內保存明成化七年（1471）《法王廟創建舞庭記》、弘治十五年（1502）、萬曆三十六年（1608）重修碑，另有清嘉慶二十一年（1816）修繕碑。現存山門、樂樓／舞亭、正殿，以及七星殿、九曜殿、十帥殿、後土聖母殿、瘟神藥王殿、牛馬王殿等配殿。正殿面闊五間、進深兩間，單檐懸山頂，前有抱廈；舞亭為方形無內柱空間，重檐十字歇山頂，結構仍保留元代樂樓形制傳統，但現存舞亭本體為明代建築。舞亭建造年在資料中有1471（碑記年款）與1472（文化資源網介紹）兩種寫法，應分別保留碑記年款與後世建築資料，不自行合併。第七批國保編號7-0832-3-130，名錄時代元、明至清。參考：[第七批國保名錄](https://zh.wikisource.org/wiki/國務院關於核定並公布第七批全國重點文物保護單位的通知)；[山西文化資源網：南陽法王廟](https://www.sxwhzyw.cn/pd500070958.html)；[復旦大學 COCA 研究資料PDF](https://loca.fudan.edu.cn/coca/PDF/2011/COMONCA05-003.pdf)；[南陽法王廟文保資料](https://www.iwenbo.fun/heritage/3383.html)。", "access": "稷山縣稷峰鎮南陽村西約300米；村廟管理和院內開放情況需出發前聯絡村委或管理方", "map": "https://www.google.com/maps/search/?api=1&query=35.59473290,110.93315802", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-032"}, {"id": "YC-033", "city": "運城市", "name": "青龍寺", "loc": "運城市稷山縣", "era": "現存殿宇包含元、明時期遺構；中殿（腰殿）有元代建築構件，後殿大殿及部分壁畫經明洪武年間補繪；腰殿水陸畫年代存在元末至明初的學術討論", "found": "地方志及寺內碑文傳稱唐龍朔二年（662）創建；此為寺院沿革傳統，現存主要建築與壁畫的實物年代以元、明為主", "level": "第五批全國重點文物保護單位，編號5-0275-3-074，名錄時代「元」；壁畫實際跨元、明兩期", "status": "部分覈實", "conf": "A", "note": "青龍寺位於稷山縣城西約4公里馬村西側。寺院傳統沿革稱唐龍朔二年（662）由工部尚書王政奉敕督建，但這一創建說主要來自縣志、寺碑的後世記載；現存殿宇和壁畫本身主要反映元、明兩期，不能把現存寺院一概稱作唐代建築。寺院保存大殿、中殿（腰殿）、伽藍殿等壁畫，常見總面積統計約196.38平方米。大殿東西壁佛教壁畫包括三世佛、西方三聖等題材；腰殿四壁水陸畫融合佛、道、儒諸神祇，人物三百餘身，圖像層次豐富。年代需細分：伽藍殿拱眼壁有至正五年（1345）供養人題記；腰殿建築常繫於元至元二十六年（1289），但水陸畫年代研究存在多說，部分學者依題記與補繪痕跡認為其完成或重繪在元至正十六年（1356）至明洪武元年（1368）之間；後殿東西壁及門神另有洪武十八年（1385）補繪／重裝題記。不可把1345年題記當成全部壁畫的統一繪製年。壁畫題材、榜題和供養人資訊可用於研究晉南元明宗教圖像、地方社群與水陸法會。第五批國保，編號5-0275-3-074。參考：[故宮博物院早期壁畫資料PDF](https://img.dpm.org.cn/Uploads/pdf/1958/T00028_00.pdf)；[伊寶史宏蕾：《山西青龍寺腰殿壁畫的繪畫語言特徵》，《文藝研究》2008年第11期](https://m.fx361.com/news/2008/0429/27654341.html)；[《稷山青龍寺壁畫研究——以腰殿水陸畫為中心》](https://www.academia.edu/43774047/稷山青龙寺壁画研究_以腰殿水陆画为中心)；[第五批國保資料列表](https://zh.wikipedia.org/wiki/稷山县各级文物保护单位列表)。", "access": "稷山縣城西約4公里馬村西側；寺內壁畫需遵守文物保護與拍攝規定，開放時間及是否需預約須另核", "map": "https://www.google.com/maps/search/?api=1&query=35.58907392,110.92186639", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-28-part-01.md#yc-033"}, {"id": "YC-034", "city": "運城市", "name": "古垛后土廟", "loc": "運城市河津市古垛村東南角", "era": "現存聖母殿／大殿及戲台為元代遺構；元代元貞元年（1295）有修葺紀年", "found": "始建年代不詳；另有元元貞二年（1296）創建說，與1295年修葺說不一致，暫不作定論", "level": "第六批全國重點文物保護單位；編號待以正式名錄細編號核對，名錄時代元", "status": "部分覈實", "conf": "A", "note": "坐北朝南，一進院。現存元代核心殿堂及戲台；殿面闊三間、進深三椽，單檐懸山頂，戲台面闊三間、進深四椽，柱頭四鋪作單昂。1295年為修葺紀年；另有1296年創建說，兩者不可混為一談。參考：薛晶琳《河津市省級以上古建築文保單位利用現狀研究》（2023）；山西文化資源網河津市文保名錄；古垛后土廟資料彙編。", "access": "河津市樊村鎮古垛村；院落及殿內開放情況未核實，出發前聯絡屬地文保管理方", "map": "https://www.google.com/maps/search/?api=1&query=35.70649258,110.71916470", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-034"}, {"id": "YC-035", "city": "運城市", "name": "河津臺頭廟", "loc": "運城市河津市", "era": "元代大門、中門；其餘殿宇包含明清時期建築，東西過殿及耳殿資料判為清代", "found": "始建年代不詳；碑記載明成化四年（1469）、九年（1474）及清道光十年（1830）重修", "level": "第七批全國重點文物保護單位，編號7-0895-3-122，名錄時代元至清", "status": "部分覈實", "conf": "A", "note": "又稱西岳廟。現存十座殿宇，沿南北中軸有大門、中門、獻殿、東岳殿，兩側有后土祠、西岳殿及過殿、耳殿。元代大門、中門面闊五間、進深四椽，單檐懸山頂，四鋪作單下昂斗栱。1469、1474、1830均為重修紀年，不是始建年代；部分二手資料對成化年份有一歲異寫。參考：憶起追跡台頭廟文保資料；薛晶琳2023年河津古建研究；山西文化資源網河津市文保名錄。", "access": "河津市城區新耿南街與龍崗路交叉口東北；當前院落開放範圍未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.58339261,110.70743234", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-035"}, {"id": "YC-036", "city": "運城市", "name": "阮氏雙碑樓", "loc": "運城市河津市西梁村", "era": "清光緒三年（1877）父碑樓；子碑樓常見記為光緒五年（1879），另有光緒四年（1878）異說", "found": "清光緒年間（1877—1879）建造父子德行碑樓", "level": "第八批全國重點文物保護單位，編號8-0255-3-058，名錄時代清", "status": "部分覈實", "conf": "A", "note": "父子雙碑樓並列，相距約1.27米，均為仿木磚雕結構、單檐歇山頂，四面設匾額、楹聯及青石四面碑。父樓1877年、子樓多記1879年，另有1878年異說；高度資料亦有約8.7米與約13米差異，暫不作精確測繪值。參考：憶起追跡阮氏雙碑樓資料；黃河新聞網西梁村專題轉載；山西文化資源網河津市文保名錄。", "access": "河津市小梁鄉西梁村；村內公共空間可達性及近距離觀賞安排未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.50645183,110.65343736", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-036"}, {"id": "YC-037", "city": "運城市", "name": "玄帝廟", "loc": "運城市河津市樊村鎮", "era": "明代建築群；明萬曆二十三年（1595）及三十二年（1603）有重修題記", "found": "常見記載明隆慶三年（1569）始建、萬曆年間（1603）完成；另有1570年始建異寫", "level": "第七批全國重點文物保護單位，編號7-0960-3-187，名錄時代明至清", "status": "部分覈實", "conf": "A", "note": "俗稱琉璃廟，三進院落，中軸依次為山門、香亭、中殿、正殿。香亭為二層三重檐；中殿重檐歇山頂；正殿單檐懸山頂。建築大量使用琉璃筒瓦、板瓦、龍頭及脊獸。始建1569／1570年有異寫；1595、1603年為重修題記。參考：新華社2014年玄帝廟修繕報導；憶起追跡玄帝廟文保資料；山西文化資源網河津市文保名錄。", "access": "河津市樊村鎮樊村東北角；2014年曾進行保護修繕，當前開放狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.67336377,110.70955861", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-037"}, {"id": "YC-038", "city": "運城市", "name": "北辛舍利塔", "loc": "運城市萬榮縣北辛莊村", "era": "明代磚塔；常見建塔年代為明洪武十六年（1383）", "found": "原為崇勝禪院附屬建築；原寺已毀，塔獨存", "level": "第八批全國重點文物保護單位，編號8-0225-3-028，名錄時代明", "status": "部分覈實", "conf": "B", "note": "原為崇勝禪院附屬塔。公開資料對塔形、層數及高度嚴重矛盾：央廣網稱圓形五層覆鉢式、約15米；另一地方資料稱三級覆鉢式、方形平面、約21米。1383年為常見建塔年代說。未取得正式測繪或現場核對前，不對塔形及高度作定論。參考：央廣網2024年萬榮國保報導；《文物看山西之運城地區》資料摘錄；萬榮縣文保名錄彙整。", "access": "萬榮縣榮河鎮北辛村；塔周邊可達性及保護圍護情況未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.38862149,110.52796477", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-038"}, {"id": "YC-039", "city": "運城市", "name": "南陽壽聖寺塔", "loc": "運城市萬榮縣南陽村學校內", "era": "宋代樓閣式磚塔；八角形、十一級，公開資料記高約30米", "found": "建塔年份不詳，現依塔身形制判斷為宋代", "level": "第七批全國重點文物保護單位，編號7-0776-3-074，名錄時代宋", "status": "部分覈實", "conf": "B", "note": "八角形十一級樓閣式磚塔，塔身逐層收分，一層可見仿木斗栱磚雕，二層以上多以疊澀出檐。建造年份未見可直接核實題記，應採宋代形制判斷，不虛構精確年份。參考：央廣網2024年萬榮國保報導；第七批國保名錄資料；萬榮縣文保名錄彙整。", "access": "萬榮縣里望鄉南陽村；原始資料標註學校內，當前校園進入與參觀規定未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.49685863,110.79064347", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-039"}, {"id": "YC-040", "city": "運城市", "name": "萬泉文廟", "loc": "運城市萬榮縣萬泉鎮", "era": "現存大成殿重建於明正統四年（1439）；琉璃影壁及其他遺存需分別斷代", "found": "創建年代不詳；縣志線索稱宋至和元年（1054）以前已有文廟", "level": "第六批全國重點文物保護單位，編號6-0468，名錄時代明", "status": "部分覈實", "conf": "A", "note": "舊萬泉縣城文廟，坐北朝南。現存大成殿面闊五間、進深三間，單檐歇山頂；另存琉璃影壁、碑刻及七株被稱為唐柏的古柏。1054年前已有文廟是縣志沿革線索，始建年份不詳；現存大成殿以1439年重建為主要年代依據。院內尚存1597年重修碑及1725年太學碑。參考：裴瑩《文廟禮制建築形制探析》（2024）；萬泉文廟文保資料彙編；第六批國保資料摘錄。", "access": "萬榮縣萬泉鄉萬泉村東部；現存大成殿、琉璃影壁及院落開放安排未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.36118543,110.80331021", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-29-part-01.md#yc-040"}, {"id": "YC-041", "city": "運城市", "name": "萬榮東嶽廟", "loc": "運城市萬榮縣", "era": "元至元二十八年至大德元年（1291—1297）重建；飛雲樓現存形制主要為明代營建、清代重修，其他殿宇多存元代遺構及明清修繕", "found": "創建年代不詳；地方志及清碑有唐貞觀年間已有東嶽廟的說法，尚不能作為現存建築唐代始建證據", "level": "第三批全國重點文物保護單位，編號3-0129-3-077，名錄時代元至清", "status": "部分覈實", "conf": "A", "note": "亦稱岱岳廟、泰山廟，坐北朝南，軸線由南至北有山門、飛雲樓、午門、獻殿、享亭、東嶽大帝殿及閻王殿。創建年代不詳，1291—1297年元代重建，1520、1617、1746年及咸豐年間均有修繕。飛雲樓通高約23.19米，平面近方形，外觀三層、內部明三暗五，四根通天柱與柱網、額枋、斗栱共同承重；午門、獻殿、東嶽大帝殿保留元代構造特徵。參考：央廣網／山西日報2024萬榮國保介紹；憶起追跡東嶽廟；山西文物局資料轉載；山西建築職業院校2025飛雲樓介紹。", "access": "萬榮縣解店鎮西大街；CSV原始點與外部文保定位有數百米差距，需現場核對入口及本體位置；開放狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.41595299,110.82917383", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-30-part-01.md#yc-041"}, {"id": "YC-042", "city": "運城市", "name": "萬榮旱泉塔", "loc": "運城市萬榮縣卓立村東孤峯山西麓", "era": "第七批國保名錄列宋；塔體常見描述為方形十一級密檐式實心磚塔，殘高約31.2米；另有金代塔體說", "found": "原屬孤山槛泉寺（又名陷泉寺）；《萬泉縣志》記寺院建於宋宣和二年（1120），不等於現存塔身必然同年建成", "level": "第七批全國重點文物保護單位，編號7-0775-3-073，名錄時代宋", "status": "部分覈實", "conf": "B", "note": "又名槛泉塔，原為槛泉寺附屬建築，寺毀塔存。方形十一級密檐式實心磚塔，殘高約31.2米；下部檐口可見仿木磚雕斗栱、倚柱、額枋等，上部以疊澀出檐。國保名錄著錄宋代；縣志記槛泉寺於1120年創建，部分資料將塔與寺同年，另有塔體金代說。須分清寺院創建與現存塔體斷代。參考：第七批國保名錄；《萬泉縣志》寺觀條目；文物看山西運城資料；旱泉塔建築資料彙編。", "access": "萬榮縣高村鎮卓里村東、孤峰山西麓；CSV原始點與公開文保座標有數百米差距，需現場核對塔體位置及山麓道路", "map": "https://www.google.com/maps/search/?api=1&query=35.33667918,110.77024134", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-30-part-01.md#yc-042"}, {"id": "YC-043", "city": "運城市", "name": "萬榮后土廟", "loc": "運城市萬榮縣廟前村北", "era": "現址祠廟於清同治年間遷建；山門、秋風樓有更早遺構或構件說，秋風樓亦有同治九年重建說", "found": "汾陰后土祭祀可追溯漢代；現址為清代遷建，歷代祠廟多次因黃河水患毀壞、遷建", "level": "第四批全國重點文物保護單位，編號4-0167-3-089，名錄時代清", "status": "部分覈實", "conf": "B", "note": "通稱后土祠，坐北朝南，沿軸線有山門、戲台、獻殿、享亭、正殿、秋風樓及東西五虎殿。漢代祭祀歷史不可等同現存建築年代；清同治年間遷建至現址，遷建年份見1870／1874異說。秋風樓有明代遺構說，也有清同治九年重建說，樓內元刻《秋風辭》碑不代表現存樓身必為元代。參考：山西晚報2025后土廟專題；山西省文物局資料轉載；張力中《萬榮秋風樓建築特徵探析》（2022）；中新網2024報導。", "access": "萬榮縣榮河鎮庙前村北；CSV原始點與公開文保定位有數百米差距，須現場確認是否落在祠廟本體及入口；開放狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.34357497,110.47895485", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-30-part-01.md#yc-043"}, {"id": "YC-044", "city": "運城市", "name": "萬榮稷王廟", "loc": "運城市萬榮縣太趙村", "era": "大殿主體不晚於北宋天聖元年（1023）；戲台南北兩部分含民國十年（1921）移建改造及後期修繕", "found": "始建年代不詳；大殿「天聖元年」墨書題記證明1023年時建築已存在", "level": "第五批全國重點文物保護單位；2001年名錄曾著錄金代，後經北大考古測繪及題記研究改判北宋前期", "status": "部分覈實", "conf": "A", "note": "本點為萬榮太趙村稷王廟，主祀后稷，勿與稷山縣稷王廟混淆。大殿坐北朝南，面闊五間、進深六椽，單檐庑殿頂，內設回廊；2011年北大團隊在前檐襻間枋發現「天聖元年」（1023）墨書題記，後續形制、材料、碳十四及精細測繪研究判定大殿始建不晚於1023年。現存戲台由南北兩部分組成，北部有民國十年移建題記，1924年碑記亦述戲樓移建。參考：北京大學考古文博學院2011公告；故宮博物院院刊2015稷王廟格局研究；徐怡濤《文物》2014碳十四研究。", "access": "萬榮縣南張鄉太趙村；2011年曾進行修繕及精細測繪，當前開放、管理及殿內參觀狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.44958144,110.77429170", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-30-part-01.md#yc-044"}, {"id": "YC-045", "city": "運城市", "name": "萬榮稷王山塔", "loc": "運城市萬榮縣東南稷王山頂", "era": "北宋八角形七級密檐式磚塔，殘高約23米；建塔紀年存在1056—1057與1087兩組互相矛盾的碑銘釋讀", "found": "原屬稷王山後稷廟建築群，廟已毀；塔的建造紀年待原碑拓片及完整釋文核定", "level": "第七批全國重點文物保護單位，編號7-0773-3-071，名錄時代宋", "status": "部分覈實", "conf": "B", "note": "八角形七級密檐式磚塔，殘高約23米，塔身逐層收分，底層檐下有仿木磚雕斗栱、普拍枋，塔內中空，塔剎殘毀。傳統文物資料及央廣網2024報導稱元祐二年（1087）建塔；宋彥延等2024年《文史月刊》文章則據塔內石碑釋讀為至和三年（1056）發願、嘉祐二年（1057）起塔。兩說相差約三十年，未取得原碑高清影像及拓片 m/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-31-part-01.md#yc-050"}, {"id": "YC-051", "city": "運城市", "name": "大洋泰山廟會", "loc": "運城市夏縣大洋村西", "era": "現存正殿為元代建築；梁架題記記元大德八年（1304）及明隆慶五年（1571）修葺", "found": "大洋泰山廟始建年代不詳；CSV原始名稱「大洋泰山廟會」正式文保名稱為「大洋泰山廟」", "level": "第六批全國重點文物保護單位，編號6-0434-3-137，名錄時代元", "status": "部分覈實", "conf": "A", "note": "正式名稱為大洋泰山廟，CSV原始名稱多出「會」字，為保留原始點位名稱本次不改原欄。廟坐北朝南，始建年代不詳，現主要存正殿一座。梁架題記見元大德八年（1304）及明隆慶五年（1571）修葺，均不可誤作首次創建年。正殿面闊五間、進深二間，單檐懸山頂，前檐設廊，五鋪作單抄單下昂，四椽栿對前乳栿用三柱。2010年曾整體落架及基礎抬升保護。參考：國務院第六批國保名錄；運城新聞網2022報導；《文物看山西之運城地區》。", "access": "夏縣瑤峰鎮大洋村；現主要存正殿一座，2010年曾作落架及基礎抬升保護修繕，當前開放狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.19584914,111.26956375", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-31-part-01.md#yc-051"}, {"id": "YC-052", "city": "運城市", "name": "張村聖庵寺塔", "loc": "運城市臨猗縣張村村", "era": "北宋時期；六邊形七層磚塔，殘高約11.62米；第七層及塔剎於20世紀70年代遭雷擊損毀", "found": "清康熙三十八年（1700）《猗氏縣志》記塔始建於北宋，尚無已核實的精確宋代建造年份", "level": "第七批全國重點文物保護單位，編號7-0772-3-070，名錄時代宋", "status": "部分覈實", "conf": "B", "note": "六邊形七層磚塔，底層每邊約1.5米，殘高約11.62米，坐北朝南，逐層收分並以疊澀出檐。第一層檐下有仿木構斗栱、普拍枋，把頭絞項作及蚂蚱頭；第三、四層磚雕仿木板門、直棂窗。底層有約2.5米高塔室，頂部為六邊形疊澀藻井。1700年《猗氏縣志》追記其始建於北宋，未提供精確年份。寺院1958年被毀，塔第七層與塔剎在20世紀70年代遭雷擊損毀。正式國保編號依第七批名錄為7-0772-3-070，部分網頁編號有誤。參考：第七批國保名錄；憶起追跡聖庵寺塔；《文物看山西之運城地區》。", "access": "臨猗縣北景鄉張村；聖庵寺於1958年被毀，現存塔體；當前村內道路及接近條件未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.21705666,110.76380017", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-31-part-01.md#yc-052"}, {"id": "YC-053", "city": "運城市", "name": "妙道寺雙塔", "loc": "運城市臨猗縣", "era": "北宋；西塔地宮碑記熙寧二年（1069）建塔，東塔無直接紀年題記，依形制及布局推定年代相近；明嘉靖、萬曆年間有損修記錄", "found": "妙道寺始建年代不詳，曾稱永福院、雁塔寺及雙塔寺；寺院已毀，現存東西雙塔", "level": "第六批全國重點文物保護單位，編號6-0369-3-072，名錄時代宋", "status": "部分覈實", "conf": "A", "note": "東西雙塔相距約80米，皆為方形樓閣式磚塔，但內部結構不同。西塔地宮碑記北宋熙寧二年（1069）創建西塔及地宮；1995年地宮遭盜後由縣博物館搶救清理，出土文物二十餘件。西塔中空，原制常記九級；東塔為實心塔柱、七級，東塔建造年代無直接紀年，依形制及布局推定為北宋且與西塔相近。資料對西塔現存層數、原始層數及殘高口徑不一，需依1997年《文物》地宮清理簡報和現場測繪區分。參考：國務院第六批國保名錄；喬正安等《山西臨猗雙塔寺北宋塔基地宮清理簡報》（《文物》1997年第3期）；《中華遺產》2010雙塔專題；故宮博物院院刊仿木構磚塔比較研究。", "access": "臨猗縣城北雙塔學校周邊；雙塔相距約80米，現場管理及是否可進入塔周邊未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.14826799,110.76858050", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-31-part-01.md#yc-053"}, {"id": "YC-054", "city": "運城市", "name": "牆下關帝廟", "loc": "運城市夏縣牆下村", "era": "明清時期；清初樂樓有康熙二十年（1681）重修戲樓題記，現存院落含樂樓、看亭、獻亭、正殿、寢殿及東西配殿", "found": "常見文保資料稱清康熙十六年（1677）始建；國保名錄列明清；元至正七年（1347）說缺乏直接證據，暫不採用", "level": "第八批全國重點文物保護單位，編號8-0248-3-051，名錄時代明清", "status": "部分覈實", "conf": "B", "note": "坐北朝南，常見資料記占地約25,000平方米，中軸線有樂樓、看亭、獻亭、正殿、寢殿；正殿西側有觀音殿、牛馬王祠，東側有土地殿。樂樓上下兩層，下層作通道、上層演戲，面闊三間、進深四椽，六檩前廊式構架，單檐硬山頂，檐下三踩單下昂。梁脊板留「大清康熙二十年歲次辛酉十社燈酒會重修戲樓謹誌」題記。文保資料常稱1677年始建，但仍應尋找建廟原始碑記；網路流傳1347年元代始建說未見直接證據。參考：國務院第八批國保名錄；牆下關帝廟文保資料；夏縣文保名錄彙整。", "access": "夏縣裴介鎮牆下村；位於村落內，現場入口、開放及管理狀態未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.13494010,111.16040643", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-31-part-01.md#yc-054"}, {"id": "YC-055", "city": "運城市", "name": "上馮聖母廟", "loc": "運城市夏縣上馮村委會院內", "era": "元代聖母殿；明代看亭；清代關王殿", "found": "常見資料稱元延祐三年（1316）創建，仍待原始碑記核實", "level": "第七批全國重點文物保護單位，編號7-0831-3-129，名錄列元、明至清", "status": "部分覈實", "conf": "B", "note": "元代聖母殿面闊三間、進深二間，單檐懸山頂，八棱柱、四鋪作單下昂及斜拱；殿內山牆上方有懸塑天宮樓閣。明代看亭由主亭及前檐抱廈組成，內有八邊形藻井及琉璃脊飾；關王殿為清代建築。1316年為常見創建說，尚待原始碑記核實；現存神像報導稱今人重塑，不應誤作元塑。參考：第七批國保名錄；運城長安網／運城新聞網2022年上馮聖母廟報導；第七批國保資料彙編。", "access": "夏縣埝掌鎮上馮村；廟址報導稱村中小花園一帶，CSV 地址指村委會院內，入口是否相同未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.24488159,111.30773961", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-055"}, {"id": "YC-056", "city": "運城市", "name": "司馬光墓", "loc": "運城市夏縣小晃村北", "era": "北宋司馬光及家族墓園；余慶禪院大佛殿為北宋遺構，守墳祠大殿資料稱明代", "found": "司馬光（1019—1086）卒後歸葬夏縣祖塋", "level": "第三批全國重點文物保護單位，編號3-0246-2-017，名錄列北宋", "status": "部分覈實", "conf": "A", "note": "司馬光墓為北宋家族墓園，包含坟茔區、忠清粹德碑樓、溫公祠堂、余慶禪院及涑水書院等部分，約5.5公頃。墓園有多座墓冢、石人石獸及宋金元明清碑刻；蘇軾撰書的司馬光神道碑及忠清粹德碑尤具文獻價值。余慶禪院大佛殿為北宋遺構，守墳祠大殿資料稱明代建築；不可把墓園內所有建築一概定為北宋。參考：第三批國保名錄；運城發布2022年司馬溫公祠介紹；司馬光墓文保資料。", "access": "夏縣水頭鎮小晁村北／鳴條崗；CSV 寫「小晃村」，常見文保資料作「小晁村」，入口及座標需核實", "map": "https://www.google.com/maps/search/?api=1&query=35.19933950,111.11674250", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-056"}, {"id": "YC-057", "city": "運城市", "name": "夏縣文廟大成殿", "loc": "運城市夏縣", "era": "現存大成殿以明代遺構為主；局部保留較早建築做法，2014年整體抬升修繕", "found": "清乾隆二十七年（1762）《夏縣志》記文廟始建於宋、元至元十四年（1354）重修", "level": "第七批全國重點文物保護單位，編號7-0845-3-143，名錄列明", "status": "部分覈實", "conf": "A", "note": "夏縣文廟現僅存大成殿。大殿坐北朝南，面闊七間、單檐歇山頂，筒板瓦屋面、琉璃剪邊，兩山山花及博風板有琉璃裝飾；外檐斗栱有六鋪作、出三下昂及斜栱等做法。乾隆《夏縣志》所記宋代創建、1354年重修是文廟沿革，國保名錄將現存大成殿列明，不能混同。2014年完成整體抬升修繕。資料對進深以「五間」或「八椽」表述，需對照測繪圖理解。參考：運城市政府網站第七批國保資料；夏縣文廟大成殿資料彙編；地方建築報導。", "access": "夏縣城內解放南路學巷；CSV 僅記夏縣，精確入口及當前開放未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.13512363,111.21904472", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-057"}, {"id": "YC-058", "city": "運城市", "name": "常平關帝家廟", "loc": "運城市鹽湖區常平村", "era": "現存院落以明清累積建築為主；獻殿嘉慶二十三年（1818）重建；祖塔有金大定丁酉（1177）建塔銘文線索", "found": "常平村關帝故里祭祀空間，創建沿革需依廟內碑刻逐項梳理", "level": "第六批全國重點文物保護單位，編號6-0479-3-182，名錄列清", "status": "部分覈實", "conf": "B", "note": "常平關帝家廟正式國保名稱為常平關帝廟。院落坐北朝南，沿前朝後寢格局布置，有木牌坊、鐘鼓樓、石牌坊、山門、午門、獻殿、崇寧殿、娘娘殿及聖祖殿。石牌坊「關王故里」有嘉靖三年（1524）立說；祖塔嵌銘記金大定丁酉（1177）建塔及明清重修；獻殿據題記嘉慶二十三年（1818）重建，聖祖殿有乾隆二十八年（1763）重建記載。各單體年代不可一概按國保名錄列清。參考：第六批國保資料；運城市全國重點文保通覽轉載；常平關帝廟資料彙編。", "access": "運城市鹽湖區解州鎮常平村；公開景區定位與 CSV 原始座標相距數百米，入口需另核", "map": "https://www.google.com/maps/search/?api=1&query=34.93133205,110.95126557", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-058"}, {"id": "YC-059", "city": "運城市", "name": "池神廟及鹽池禁牆", "loc": "運城市鹽湖區", "era": "池神廟現存建築主要為明清遺構；鹽池禁牆有明成化十年（1474）修築、正德十二年（1517）加厚重修記載", "found": "唐大歷十二年（777）前後已有池神祭祀及建祠沿革；現址沿革含後世遷建", "level": "第七批全國重點文物保護單位，編號7-0870-3-168，名錄列明至清", "status": "部分覈實", "conf": "A", "note": "池神廟及鹽池禁牆為合併國保項目。池神廟坐北朝南，現存三大殿東西並列，分祀池神、條山神及風洞神，均為重檐歇山頂、四周設廊，斗栱有三踩單昂及五踩雙昂等做法；南側有戲台。唐代是池神祭祀與建祠沿革，現存廟宇主要為明清建築。鹽池禁牆為保護鹽池及鹽業秩序的夯土防護設施，常見資料記1474年修築、1517年加厚重修，現存殘段並非全線可通行。部分網站誤列國保編號7-0941，本批依名錄序號採7-0870-3-168。參考：《山西通志》；《金石萃編》；池神廟及鹽池禁牆文保資料。", "access": "運城市鹽湖區卧雲岡及鹽池周邊；禁牆為分散線性遺存，不能以單一座標代表完整參觀入口", "map": "https://www.google.com/maps/search/?api=1&query=35.00792134,110.99965915", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-059"}, {"id": "YC-060", "city": "運城市", "name": "泛舟禪師塔", "loc": "運城市鹽湖區寺北村", "era": "唐貞元九年（793）建塔；唐長慶二年（822）刻塔銘", "found": "唐代報國寺住持泛舟禪師墓塔；報國寺原有建築已毀", "level": "第五批全國重點文物保護單位，編號5-0250-3-056，名錄列唐", "status": "部分覈實", "conf": "A", "note": "泛舟禪師塔為單層圓形磚塔，通高約10米、直徑約5.7米；塔身外側以八根方形磚柱分為八間，南面開門，內部為六邊形塔室，頂部作疊澀藻井。北面嵌《安邑縣報國寺故大德泛舟禪師塔銘》，記塔建於唐貞元九年（793），塔銘於長慶二年（822）刻立，兩者相隔29年。報國寺其他建築已毀，2013—2014年曾作修繕。參考：運城市政府網站第五批國保資料；山西日報／澎湃新聞2025年報導；泛舟禪師塔文保資料。", "access": "運城市鹽湖區大渠街道寺北村；原報國寺遺址一帶，當前入口及塔體近距離參觀方式未核實", "map": "https://www.google.com/maps/search/?api=1&query=35.02155556,110.93478622", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-32-part-01.md#yc-060"}, {"id": "YC-061", "city": "運城市", "name": "郭村泰山廟大殿", "loc": "運城市鹽湖區郭村", "era": "元代木構大殿；梁架題記見元至正七年（1347）及明成化、嘉靖、萬曆、清道光年間修葺", "found": "泰山廟始建年代不詳", "level": "第六批全國重點文物保護單位，編號6-0440，名錄列元", "status": "部分覈實", "conf": "B", "note": "現存主要遺存為坐北朝南的大殿一座，面闊五間、進深六椽，單檐硬山頂，磚砌台基。前檐斗栱四鋪作單下昂，補間鋪作每間一朵；梁架為四椽栿對後乳栿、通檐用三柱，室內徹上露明造。梁架題記常見轉述包括元至正七年（1347）、明成化、嘉靖、萬曆及清道光年間修葺；1347年為重修紀年，不是廟宇始建年。局部梢間及檐部有後期改動。參考：第六批國保資料；郭村泰山廟大殿文保資料；第六批國保名錄資料彙編。", "access": "運城市鹽湖區上王鄉郭村；公開定位與 CSV 原始座標相距數百米，實際大殿位置及入口需核實", "map": "https://www.google.com/maps/search/?api=1&query=35.28351335,111.06123333", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Archit -142，名錄列元", "status": "部分覈實", "conf": "A", "note": "現存僅寨裏關帝廟獻殿，坐北朝南，東西長約16.9米、南北寬約7.28米，面闊五間、進深四椽，單檐懸山頂，前後檐施通圓木大額枋，承四鋪作單下昂斗栱。梁架四檁無廊式，徹上露明造；大梁不與下方立柱一一對應、次間柱略向明間靠攏，屬移柱造特徵。主體為元代遺構；1518年為重修香亭、獻殿紀年，2010年為現代保護修繕。參考：第六批國保名錄；運城市政府網站文保資料；寨裏關帝廟獻殿資料彙編。", "access": "運城市鹽湖區泓芝驛鎮寨裏村中心；原廟其他建築多已拆毀，入內權限需向村級管理方核實", "map": "https://www.google.com/maps/search/?api=1&query=35.16324030,110.88527234", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-33-part-01.md#yc-067"}, {"id": "YC-068", "city": "運城市", "name": "東姚溫牌坊", "loc": "運城市永濟市東姚溫村西", "era": "西側石牌坊明崇禎元年（1628）；東側磚牌坊清乾隆四十年（1775）；2014、2016年有修繕", "found": "兩坊分別為旌表衛武之妻張氏、孟庭之妻王氏而建；石坊1628年、磚坊1775年", "level": "第八批全國重點文物保護單位，編號8-0245-3-048，名錄列明清", "status": "部分覈實", "conf": "A", "note": "東姚溫牌坊正式國保項目包含兩座相距百餘米的節孝坊。西側石牌坊匾額「詔恩褒節坊」，明崇禎元年（1628），四柱三間五樓、單檐庑殿頂，青石榫卯構造；東側磚牌坊匾額「清標彤管」，題記乾隆乙未（1775），四柱三樓、單檐歇山頂，青磚仿木構，坊身有164幅磚雕。兩坊原位於蒲州古官道旁，2014、2016年先後修繕，2019年列第八批國保。參考：第八批國保名錄；2026年東姚溫牌坊實物題刻報導；運城市全國重點文保通覽。", "access": "運城市永濟市城西街道東姚溫村西；實為相距百餘米的石、磚兩坊，CSV 單一座標須現場比對", "map": "https://www.google.com/maps/search/?api=1&query=34.83670724,110.37472709", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-33-part-01.md#yc-068"}, {"id": "YC-069", "city": "運城市", "name": "董村戲臺", "loc": "運城市永濟市卿頭鎮董村小學內", "era": "元至治二年（1322）梁上題記及元代主體說；第八批國保名錄著錄為「明」，年代存在衝突", "found": "原為三郎廟附屬戲臺；廟宇創建年代未核", "level": "第八批全國重點文物保護單位，編號 8-0238-3-041；國保名錄時代列明", "status": "部分覈實", "conf": "B", "note": "戲臺坐南朝北，石砌台基，面闊三間、進深四椽，單檐歇山頂；木構內部有垂花柱、隔扇與複雜梁枋交接，前台空間較開敞。運城地方報導引永濟市文物局保護股負責人稱，梁上有元至治二年（1322）創建題記，清代多次重修，2014年修繕；2026年山西新聞報導亦記錄梁上元代題記、天啟三年墨書及乾隆重修題記。惟第八批國保名錄正式時代著錄為「明」，與元代主體說不一致，故保留矛盾，須取得題記高清照片、釋文及正式調查檔案再定。原為三郎廟附屬戲臺，三郎廟主體已毀。", "access": "永濟市卿頭鎮董村；2021年報導稱位於村委會對面，與原始標記「董村小學內」不一致；須現場核位並確認進入權限", "map": "https://www.google.com/maps/search/?api=1&query=34.89842812,110.70805419", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-34-part-01.md#yc-069"}, {"id": "YC-070", "city": "運城市", "name": "普救寺塔", "loc": "運城市永濟市仁和堡西南", "era": "現存莺莺塔為明嘉靖三十四年（1555）地震後重建，常見紀年為嘉靖四十二年（1563）或四十三年（1564）；第八批國保名錄列明", "found": "普救寺傳統沿革稱唐武則天時期創建，初名永清院；寺院沿革不等於現存塔年代", "level": "第八批全國重點文物保護單位，編號 8-0231-3-034；國保名錄列明", "status": "部分覈實", "conf": "A", "note": "普救寺塔俗稱莺莺塔，現存磚塔為方形平面、十三層密檐式，高約36.76米；塔身上部收分明顯，內部設登塔通道。1555年地震使舊塔及寺院建築受損，現塔於1563／1564年前後重建。2023年《永濟市普救寺菩薩洞保護修繕工程設計方案》採1564年；部分寺院沿革資料採1563年，故保留紀年差異。塔的密檐形制帶有較早期特徵，不可因此將現存塔直接定為唐塔。", "access": "永濟市蒲州鎮西廂村普救寺景區；塔位於寺院西側，景區入園及塔內登臨規則以現場公告為準", "map": "https://www.google.com/maps/search/?api=1&query=34.84592632,110.32801658", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-34-part-01.md#yc-070"}, {"id": "YC-071", "city": "運城市", "name": "棲巖寺塔林", "loc": "運城市永濟市下寺村東南", "era": "塔林年代跨唐至清；包含唐天寶十三載（754）大禪師塔、後唐同光三年（925）石塔、宋代舍利塔、元代塔及明清禪師塔", "found": "寺院傳統稱北周建德年間（572—577）創建，隋仁壽元年（601）改名棲岩寺；需與現存塔群分期區分", "level": "第八批全國重點文物保護單位，編號 8-0207-3-010；國保名錄列唐至清", "status": "部分覈實", "conf": "A", "note": "棲岩寺塔林是多時期塔群，不是單一年代的一座塔。資料記錄現存約26座磚塔：唐代大禪師塔（天寶十三載，754）、五代後唐石塔（同光三年，925）、宋代六角五層密檐式舍利塔、元代六角二層塔，以及明清禪師塔。另有隋仁壽年間舍利塔銘碑及相關舍利遺物記錄；部分重要碑刻現藏永濟市博物館，不能把館藏碑刻誤認為仍在山上原位。抗戰期間寺院建築遭毀，現場主要價值在多時期塔群、碑刻與山地寺院遺址。國保名錄以「唐至清」概括整體年代。", "access": "永濟市中條山下寺村東南一帶；山地道路、步行路線及塔林實際入口須向當地管理方核實", "map": "https://www.google.com/maps/search/?api=1&query=34.78752731,110.34357420", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yuncheng-batch-34-part-01.md#yc-071"}, {"id": "YC-072", "city": "運城市", "name": "永濟扁鵲廟", "loc": "運城市永濟市洗馬村北", "era": "第八批國保名錄列明代；現存東廟建築及塑像應按明代文物組合考察，塑像局部風格描述不等於確證宋代製作", "found": "扁鵲祠始建年代未核；現存碑刻中較早者為明萬曆年間重修碑記的說法，尚待原碑核對", "level": "第八批全國重點文物保護單位，編號 8-0237-3-040；國保名錄列明", "status": "部分覈實", "conf": "B", "note": "永濟扁鵲廟位於洗馬村北，國保名錄時代為明。地方資料稱原有東、西兩廟：西廟規模較大，抗戰期間被毀，今主要遺存為東廟；東廟保存山門、獻殿、正殿等建築，正殿暖閣供奉扁鵲泥塑像及侍從像。部分旅遊資料稱塑像有宋塑遺風，這是風格描述，不能直接作為宋代斷代證據。萬曆庚子（1600）《重修扁鵲祠記》常被列作現存較早碑記，仍需原碑拓片或正式調查報告確認文字與位置。", "access": "永濟市清華鄉洗馬村北約500米；原始座標與文保名錄地址相符，現場入口及管理人員安排未核", "map": "https://www.google.com/ma if(s.level)h+=`<p><span class="k">級別　</span>${esc(s.level)}</p>`;
if(s.note)h+=`<p><span class="k">看點　</span>${esc(s.note)}</p>`;
if(s.access)h+=`<p class="warn"><span class="k">開放提示　</span>${esc(s.access)}（未核實，出發前請確認）</p>`;
h+=`<p><span class="b">${esc(s.status)}</span> <span class="b">證據 ${esc(s.conf)}</span></p><div class="go"><a class="p" href="${esc(s.map)}" target="_blank" rel="noopener">📍 在地圖定位</a>${s.dossier?`<a href="${esc(s.dossier)}" target="_blank" rel="noopener">研究檔案</a>`:''}</div></div></details>`;return h}
const app=document.getElementById('app');
app.innerHTML=D.cities.map(c=>{const ss=D.sites.filter(s=>s.city===c);return`<details class="city" data-c="${c}"><summary><span>${c} <span class="cnt">${ss.length} 處</span></span></summary><div class="list">${ss.map(site).join('')}</div></details>`}).join('');
const q=document.getElementById('q'),rs=document.getElementById('rs');
function filt(){const v=q.value.trim().toLowerCase();let n=0;
document.querySelectorAll('details.city').forEach(c=>{let k=0;c.querySelectorAll('details.site').forEach(s=>{const m=!v||s.dataset.t.includes(v);s.classList.toggle('hide',!m);if(m)k++});
c.classList.toggle('hide',v&&!k);if(v)c.open=k>0;n+=k;c.querySelector('.cnt').textContent=(v?k+' / ':'')+c.querySelectorAll('details.site').length+' 處'});
rs.textContent=v?`找到 ${n} 處`:''}
q.addEventListener('input',filt);
document.getElementById('ex').onclick=()=>document.querySelectorAll('details.city').forEach(c=>c.open=true);
document.getElementById('co').onclick=()=>document.querySelectorAll('details.city').forEach(c=>c.open=false);
</script></body></html>
