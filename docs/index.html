oc": "山西省太原市晉源區風峪溝內", "era": "現存主要殿宇為明清遺構；明洪武二十四年（1391）重建，萬曆七年（1579）重修，近年另有復建工程", "found": "寺院始建年代通常繫於唐武周時期（690—705），有唐代佛塔地宮及碑刻材料支持", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "位於晉源區風峪溝太山。唐代地宮、碑刻與出土舍利是早期歷史證據，但現存殿宇主要為明清遺構；2014—2018年復建工程新建仿古建築群，須辨識歷史遺構與當代復建部分。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.75111300,112.43855596", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-015"}, {"id": "TY-016", "city": "太原市", "name": "太山博物館", "loc": "", "era": "現代博物館及展示設施；不作古代建築斷代", "found": "屬太山景區的現代展示／服務節點，與太山龍泉寺文物本體分開記錄", "level": "非獨立古建文物單位；現代博物館節點（機構及館舍沿革待核）", "status": "部分覈實", "conf": "C-線索", "note": "原始KML將太山博物館單獨標點，與太山龍泉寺座標相近。本輪未找到足以確認其獨立文物身份及館舍建成年份的權威資料，保留為現代參觀節點，不虛構古代年代；出行前核對正式館名及開放情況。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.75203765,112.43663549", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-016"}, {"id": "TY-017", "city": "太原市", "name": "天龍山石窟（博物館）", "loc": "太原市晉源區", "era": "東魏至唐多期開鑿；石窟造像及壁畫反映北齊、隋、唐等階段", "found": "北魏末至東魏時期開始開鑿", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "A", "note": "沿用既有專題檔案 places/tianlongshan-grottoes.md。須按洞窟、造像及風格分期；海外流失造像的數位回歸展示與山上原址石窟須區分。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.73320547,112.37121868", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/tianlongshan-grottoes.md"}, {"id": "TY-018", "city": "太原市", "name": "童子寺遺址", "loc": "太原市晉源區西鎮村西北山上", "era": "北齊至唐遺址；北齊大佛、燃燈石塔及唐代佛龕壁畫為重要遺存", "found": "傳統記載北齊天保七年（556）由僧宏禮創建；金天輔元年（1117）毀於兵火，明嘉靖元年（1522）重建", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "A", "note": "位於晉源區西鎮村龍山北峰。寺院建築大部已不存，遺址內保存北齊大佛、燃燈石塔；考古發掘另發現唐代佛龕壁畫及開元二年（714）石刻。這是遺址考察，不是完整寺院景點。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.73746802,112.42685622", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-018"}, {"id": "TY-019", "city": "太原市", "name": "龍山石窟", "loc": "太原市晉源區", "era": "元代道教石窟及造像", "found": "主要開鑿於元代，具體分窟題記應逐窟核對", "level": "第四批全國重點文物保護單位（1996）", "status": "部分覈實", "conf": "B", "note": "位於晉源區西鎮村龍山。與附近童子寺遺址不是同一遺址：龍山石窟以元代道教造像、洞窟及石刻為核心，童子寺則以北齊至唐佛教遺址為核心。山路及洞窟開放、安全措施須事先確認。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.73146878,112.43693665", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-019"}, {"id": "TY-020", "city": "太原市", "name": "阿育王塔", "loc": "山西省太原市晉源區", "era": "現存塔體及相關建築列明清時期；早期舍利塔沿革與現存塔體年代須分開", "found": "傳統沿革追溯隋仁壽二年（602）慧明寺舍利塔；原塔及寺院歷經毀壞、重建", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "B", "note": "正式名稱為晉源阿育王塔，位於古城營村校園範圍內。公開名錄將時代列為明至清；涉及學校操場，非一般景區，必須先取得學校或管理單位許可。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.73796523,112.48906195", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-020"}, {"id": "TY-021", "city": "太原市", "name": "晉祠", "loc": "太原市晉源區", "era": "北宋聖母殿及金代獻殿等早期建築，並存明清及近現代增建；聖母殿紀年有984年與天聖年間兩種公開表述", "found": "晉祠創建傳統早於現存宋代殿堂，為紀念唐叔虞及邑姜的祠廟", "level": "第一批全國重點文物保護單位（1961）", "status": "部分覈實", "conf": "A", "note": "沿用既有專題檔案 places/jinci-temple.md。聖母殿、獻殿、魚沼飛梁、宋代彩塑及古樹名泉構成核心。不同公開資料對聖母殿建造年份有984年與北宋天聖年間兩種表述，本輪保留差異。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.70752758,112.43633639", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jinci-temple.md"}, {"id": "TY-022", "city": "太原市", "name": "聖母殿", "loc": "", "era": "北宋聖母殿；具體紀年公開資料有984年與天聖年間兩種表述", "found": "晉祠核心祭祀建築，供奉邑姜；建築年代應與晉祠整體創建傳統區分", "level": "第一批全國重點文物保護單位（1961；屬晉祠保護範圍）", "status": "部分覈實", "conf": "A", "note": "原始地圖將聖母殿單獨標點，與TY-021晉祠是同一景區內的組成部分，不應安排成兩次獨立景點。重點觀察副階周匝、前廊木雕盤龍柱及宋代侍女彩塑。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.70891477,112.43489742", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jinci-temple.md"}, {"id": "TY-023", "city": "太原市", "name": "晉源文廟（古縣城文廟）", "loc": "太原市晉源區", "era": "明清建築；現存格局以明代遺構及後世增修為主", "found": "明洪武六年（1373）創建，為太原縣學文廟", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "位於太原古縣城東大街。五進三合院格局，保存照壁、櫺星門、泮池、大成殿、明倫堂等。須區分文廟歷史建制與現存各殿不同修建年代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.72721501,112.48240399", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-023"}, {"id": "TY-024", "city": "太原市", "name": "明秀寺(暫停開放)", "loc": "太原市晉源區", "era": "明清建築；現存格局以明嘉靖年間重建為基礎，後世有修繕", "found": "傳統記載漢代創建；明嘉靖年間因兵火毀壞後重建，年份有1542與1559等不同記載", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "位於晉源區晉祠鎮王郭村。原始點位標註暫停開放但無時間戳，僅作歷史線索。寺內有明代彩塑及佛教壁畫；嘉靖重建年份資料不一致，採明清斷代而不寫死單一年份。", "access": "暫停開放", "map": "https://www.google.com/maps/search/?api=1&query=37.68098000,112.43436396", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-024"}, {"id": "TY-025", "city": "太原市", "name": "清源文廟", "loc": "太原市清徐縣", "era": "金代大成殿為核心早期木構，其他建築含後世修繕", "found": "金泰和三年（1203）知縣張德元建文廟；現存金代建築以大成殿為主", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "位於清徐縣清源鎮。大成殿是太原地區重要金代木構之一，面闊、進深均三間，平面近方形；勿把整個文廟現存院落全部標為金代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.61124768,112.34187299", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-025"}, {"id": "TY-026", "city": "太原市", "name": "狐突廟", "loc": "太原市清徐縣", "era": "宋至清多期遺構；現存殿宇及附屬文物包含不同時期，具體分殿斷代仍需核對", "found": "地方資料有宋代始建說；部分建築史資料將現存正殿等構件列入元代重修系統，年代保留差異", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "位於清徐縣西馬峪村，祭祀春秋晉大夫狐突。現存山門、戲台、獻殿、正殿及碑刻、壁畫跨越多期；公開資料對始建及正殿年代有宋、金、元等不同說法，本輪不採單一年份定論。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.62327147,112.30455567", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-026"}, {"id": "TY-027", "city": "太原市", "name": "清徐堯廟", "loc": "太原市清徐縣", "era": "明至清建築；最早現存建築可追溯明代，帝堯殿為重要看點", "found": "創建年代未能確證；現存建築經明清營建及後世修繕", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "位於清徐縣孟封鄉堯城村。2026年新華社報導稱最早建築可追溯明代；帝堯殿又稱無梁殿。文保員值守報導不代表任何日期均可入內，仍須出發前確認。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.50128824,112.43989712", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/taiyuan-batch-04.md#ty-027"}, {"id": "YQ-001", "city": "陽泉市", "name": "府君廟", "loc": "陽泉市盂縣上設鎮中北村", "era": "元代正殿；明代過殿及後世附屬建築", "found": "創建年代不詳；元延祐二年（1315）重修", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "盂縣上社鎮中社北村。正殿為元代遺構，元延祐二年（1315）重修題記可作年代依據；壁畫曾因維修拆卸，現存放位置及展示情況應現場核對。不要把重修年直接寫成始建年。來源：陽泉市文化資源網、地方文物資料。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.32523553,113.34311548", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-001"}, {"id": "YQ-002", "city": "陽泉市", "name": "藏山祠", "loc": "陽泉市盂縣藏山村", "era": "明至清代祠廟建築", "found": "始建年代未核實；現存建築以明清時期為主", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "B", "note": "盂縣長池鎮藏山村東。國保名錄及地方文化資源資料將其列為明至清代；趙氏孤兒傳說屬祠祀文化背景，不應代替建築斷代。須與盂縣境內李莊藏山祠及藏山祠遺址區分。來源：陽泉市文化資源網、國保名錄。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.22328267,113.35840093", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-002"}, {"id": "YQ-003", "city": "陽泉市", "name": "盂北泰山廟", "loc": "陽泉市盂縣孫家莊鎮西盂北村西", "era": "元代正殿；明代西配殿；其餘多為清代遺構", "found": "創建年代不詳；元代建築為現存核心", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "A", "note": "盂縣孫家莊鎮西盂北村。正殿為元代遺構，西配殿為明代建築，戲台及其他部分為清代遺構；2015年曾整體維修。應把現存殿宇年代分開記錄，不推定寺廟始建年份。來源：陽泉市文化資源網及地方文物介紹。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.16466407,113.43020441", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-003"}, {"id": "YQ-004", "city": "陽泉市", "name": "泰山廟", "loc": "陽泉市盂縣北下莊鄉東坡頭村", "era": "元代正殿、後殿；明清附屬建築及後世修繕", "found": "創建年代不詳；元至正十七年（1357）有重建經幢記載", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "盂縣北下莊鄉東坡頭村，正式常用名坡頭泰山廟。元代經幢刻有至正十七年（1357）重建記錄；正殿、後殿為元代遺構，明清持續修葺。注意原始點位名稱「泰山廟」與正式名稱的對應。來源：陽泉市人民政府2025年專題、國保名錄。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.16247407,113.57604570", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-004"}, {"id": "YQ-005", "city": "陽泉市", "name": "西關三聖寺大殿", "loc": "陽泉市盂縣", "era": "現存正殿年代存在金代與國保名錄標註「明」的資料差異；其餘殿宇已不存", "found": "寺院沿革傳稱唐貞觀五年（631）改名三聖禪寺；宋宣和六年（1124）大鐵鐘可證寺院歷史，但不等於現存大殿建造年", "level": "第八批全國重點文物保護單位（2019；名錄時代標註明）", "status": "部分覈實", "conf": "B", "note": "盂縣秀水鎮西關村，俗稱西寺。地方文物資料記載金泰和七年（1207）重建、現存正殿為金代遺構；第八批國保名錄的時代欄則標註「明」，存在明顯差異。本輪保留衝突，不自行裁定。宋宣和六年（1124）大鐵鐘現藏藏山景區，只能作寺院歷史旁證。來源：盂縣文化資源網、國保名錄及地方文物介紹。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.08543314,113.40497704", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-005"}, {"id": "YQ-006", "city": "陽泉市", "name": "大王廟", "loc": "陽泉市盂縣秀水鎮北關村西", "era": "金代寢宮；明代正殿；清代山門、樂樓等附屬建築", "found": "創建年代不詳；金承安五年（1200）重建記載；明天順年間（1457—1464）重建正殿", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "A", "note": "盂縣城區西關、香河北岸。核心看點為金代寢宮與明代正殿，樂樓為清乾隆四十七年（1782）建。傳稱為春秋晉卿趙武行宮，但行宮傳說不等於現存建築年代。來源：盂縣人民政府、國保名錄及建築資料。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.10172340,113.41227250", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-006"}, {"id": "YQ-007", "city": "陽泉市", "name": "關王廟", "loc": "陽泉市郊萌營鎮林裏村南玉泉山腰", "era": "宋代木構建築群；近現代曾有修復及配套建設", "found": "北宋熙寧五年（1072）始建；宣和四年（1122）重修", "level": "第四批全國重點文物保護單位（1996）", "status": "部分覈實", " nxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-010"}, {"id": "YQ-011", "city": "陽泉市", "name": "平定馬齒巖寺", "loc": "陽泉市平定縣馬山村東", "era": "金代中殿（主要早期遺構）；其餘建築含後世修葺，壁畫為清代作品", "found": "創建年代不詳；金大定二十九年（1189）有重修記載", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "B", "note": "平定縣東回鎮馬山村。現存中殿被地方資料及國保介紹認定為金代遺物；金大定二十九年（1189）重修記錄不等於始建年。清代壁畫與金代木構應分開觀察；本輪未取得足以確認各殿逐一年代的完整測繪報告。來源：地方文物資料、國保名錄。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.79326600,113.92707467", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/yangquan-batch-05.md#yq-011"}, {"id": "LL-001", "city": "呂梁市", "name": "胡家溝磚塔", "loc": "省呂梁市興縣胡家溝村南", "era": "明代嘉靖年間（1522—1566）五層八角磚塔", "found": "明嘉靖年間，塔身石碣記載始建", "level": "第八批全國重點文物保護單位（2019）；原第四批省保", "status": "部分覈實", "conf": "A", "note": "普通民居墓塔，非寺院塔。塔身石碣有嘉靖紀年；五層八角樓閣式，通高約14.43米，磚雕構件精細。參觀需尊重村落及墓塔保護管理。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=38.46944165,111.04206073", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-001"}, {"id": "LL-002", "city": "呂梁市", "name": "善慶寺", "loc": "呂梁市臨縣府底村", "era": "元代創建；現存大雄寶殿等建築年代需進一步逐構件核實", "found": "元至元二十五年（1288）建寺，舊名宿皇寺", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "臨縣府底村善慶寺，地方文史資料記元至元二十五年建寺。現存山門有復建情況，不可將寺院始建年代直接套用於全部殿宇；現存殿堂、壁畫及經幢宜現場核對。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.84734409,110.98882639", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-002"}, {"id": "LL-003", "city": "呂梁市", "name": "義居寺", "loc": "呂梁市臨縣棗圪墶村北湫水河西岸", "era": "元代正殿；明代山門、前殿；清康熙五十二年（1713）重修藏經樓；唐代萬佛洞石窟", "found": "宋代創建，歷代重修", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "三進院落，坐西朝東。元代正殿、明代山門與前殿、清代藏經樓及唐代萬佛洞並存，是本批重要多時期遺存。萬佛洞雕刻及藏經洞頂部圖案值得細看。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.75066850,110.93671279", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-003"}, {"id": "LL-004", "city": "呂梁市", "name": "磧口古建築羣（磧口古鎮）", "loc": "呂梁市臨縣", "era": "明清至民國時期晉商商業聚落建築群；單體年代各異", "found": "明清時期因黃河水運及商貿繁盛而形成、發展", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "磧口古建築群應理解為聚落型歷史建築群，不是單一年代建築。核心包括西灣村民居、李家山民居及磧口鎮商業街區等；本點位是古鎮定位點，勿將群內所有建築統一標為明清。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.64263142,110.79860334", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-004"}, {"id": "LL-005", "city": "呂梁市", "name": "黑龍廟", "loc": "山西省呂梁市臨縣", "era": "明代創建；雍正年間增建樂樓，道光年間重修正殿及耳殿", "found": "明代創建", "level": "磧口古建築群範圍內重要歷史建築；單體級別待核", "status": "部分覈實", "conf": "A", "note": "位於臥虎山，為磧口標誌性建築。乾隆二十一年（1756）增修鐘鼓樓碑記載其創建於明代；雍正、道光年間續有增修。依山臨河，俯瞰古鎮與黃河、湫水河交匯地形。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.64374102,110.78620153", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-005"}, {"id": "LL-006", "city": "呂梁市", "name": "大武鼓樓", "loc": "呂梁市方山縣大武鎮大五二村", "era": "現存鼓樓年代及重修層次尚待正式調查報告核實", "found": "始建年代未能可靠確認", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "B", "note": "大武鼓樓列入第八批國保。公開資料對其具體營建年代及歷次重修記錄不足，本輪不強行填入某一朝代；現場重點觀察樓體木構、樓層及過街形制，並補查保護規劃。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.64799524,111.15407121", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-006"}, {"id": "LL-007", "city": "呂梁市", "name": "于成龍故居", "loc": "呂梁市方山縣北武當鎮來堡村", "era": "清代初期民居建築群；2014年前後修繕", "found": "與清初名臣于成龍家族居住史相關", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "A", "note": "來堡村故居由父親于時煌、兄長于化龍及于成龍相關院落組成，現存三座院落。主體為清初窯洞式院落；2014年修復，2016年開放。需區分原有房屋與修復、展示設施。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.74098390,111.27991370", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-007"}, {"id": "LL-008", "city": "呂梁市", "name": "安國寺", "loc": "呂梁市離石區杜家山村西北", "era": "現存建築群包含多次修建及近現代維護；單體精確年代待逐殿核實", "found": "地方碑記稱唐貞觀十一年（637）創建", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "B", "note": "原名安吉寺。唐代創建說據碑記傳承；現存包括大雄寶殿、銅塔樓、萬佛閣、十王殿等多組建築，不能將全寺現存建築一概定為唐代。可留意寺院依山就勢的多層院落。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.52510312,111.05088343", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-008"}, {"id": "LL-009", "city": "呂梁市", "name": "天貞觀（鳳山道院）", "loc": "呂梁市離石區前瓦村", "era": "現存建築包含金、明、清及後期修繕；正殿結構年代需以測繪報告核實", "found": "始建年代待考", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "天貞觀又稱鳳山道院，位於離石前瓦村。官方國保名錄確認其國保身份，但本輪未取得足以逐殿斷代的公開一手材料；暫不把常見網路說法當作確定年代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.52552962,111.13983021", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-009"}, {"id": "LL-010", "city": "呂梁市", "name": "香嚴寺", "loc": "呂梁市柳林縣柳林鎮賀昌村", "era": "宋、金、元、明、清多時期建築並存；以金元殿宇及金代磚雕為重要看點", "found": "唐貞觀十三年（639）創建說見地方文旅資料", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "A", "note": "柳林縣賀昌村香嚴寺為多朝代建築群，地方文旅資料稱現存宋、金、元、明、清五朝建築，並有金代磚雕、黑釉琉璃。2026年研究文章亦記錄宋、金、元、明、清建築構成。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.43888279,110.89766112", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-010"}, {"id": "LL-011", "city": "呂梁市", "name": "玉虛宮", "loc": "呂梁市柳林縣柳林鎮青龍村", "era": "明代重建（1600）；現存下院多為清代建築", "found": "始建年代不詳；明萬曆二十八年（1600）重建", "level": "第七批全國重點文物保護單位（2013），名錄名稱為玉虛宮下院", "status": "部分覈實", "conf": "B", "note": "需注意資料庫原名「玉虛宮」與國保名錄「玉虛宮下院」的範圍關係。玄天殿脊檁題記記明萬曆二十八年重建，清順治十一年（1654）修葺；下院多數附屬殿宇為清代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.43656061,110.90466874", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-011"}, {"id": "LL-012", "city": "呂梁市", "name": "金代東嶽廟（興東垣東嶽廟）", "loc": "呂梁市石樓縣興東垣村", "era": "金代大殿原構；其餘建築多為明清遺存", "found": "始建年代不詳，金代已有", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "A", "note": "興東垣東嶽廟大殿為金代遺構，現存三間歇山頂，前廊形制及斗栱具有早期特徵；明崇禎十四年（1641）重修題記。院落其餘建築多為明清。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.04926907,110.94598292", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-012"}, {"id": "LL-013", "city": "呂梁市", "name": "殿山後土聖母廟", "loc": "呂梁市石樓縣張家河村", "era": "正殿為無梁殿磚石結構，元至正七年（1347）重修；殿內存明代泥塑", "found": "始建年代不詳；元至正七年（1347）重修", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "位於石樓縣張家河村附近殿山。文旅部資料稱正殿前石雕燈台記載元至正七年重修；正殿為磚石無梁殿，殿內存明代泥塑五尊。不可把元代重修年份寫成始建年份。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.97462448,110.51790028", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-013"}, {"id": "LL-014", "city": "呂梁市", "name": "山神峪千佛洞", "loc": "呂梁市交口縣山神峪村", "era": "石窟造像推定元初；寺廟現存建築以明清為主，另有清代舍利塔", "found": "千佛洞開鑿年代不詳；地方文旅資料依造像風格推定元初", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "B", "note": "洞內石壁雕佛1055尊。官方地方文旅資料認為造像風格近元初，洞前元代建廟，現存寺廟主要建築則為明清；左側六角五層磚石舍利塔為清代。各部分年代必須分開記。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.86928087,111.08418027", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-014"}, {"id": "LL-015", "city": "呂梁市", "name": "豎石佛摩崖造像", "loc": "呂梁市交城縣豎石佛村西南", "era": "北齊至唐代摩崖造像", "found": "北齊至唐", "level": "第八批全國重點文物保護單位（2019）；原省保", "status": "部分覈實", "conf": "B", "note": "交城豎石佛村西南摩崖造像，國保名錄時代標為北齊至唐。具體龕窟分期、造像數量及題記需查正式調查資料；現場需留意山路、岩面風化及保護範圍。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.63599344,112.14165067", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-015"}, {"id": "LL-016", "city": "呂梁市", "name": "卦山天寧寺（南門）", "loc": "呂梁市交城縣田家山村西北", "era": "唐至清多時期古建築群；現存各組殿宇需分別斷代", "found": "唐貞觀元年（627）創建說見地方文旅資料", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "本條為卦山天寧寺南門定位點，與LL-017大雄寶殿屬同一卦山建築群，不應當作兩個互不相關的景區。卦山寺院群包含天寧寺、石佛堂、書院、聖母廟等多組建築；唐代創建沿革不代表現存全部殿宇均為唐構。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.56786600,112.13071039", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-016"}, {"id": "LL-017", "city": "呂梁市", "name": "天寧寺大雄寶殿", "loc": "", "era": "大雄寶殿：清嘉慶九年（1804）重建，保持明代風格（網站轉述）；整體寺院始建傳為唐貞觀元年（627）", "found": "隸屬卦山天寧寺，寺院創建傳統為唐代", "level": "全國重點文物保護單位，第六批（網站轉錄編號 6-0356-3-059），所在：交城縣卦山天寧寺（整體）", "status": "部分覈實", "conf": "B", "note": "網站未載大雄寶殿本身的題記，嘉慶九年年份為網站轉述，須核原件；殿內金身大佛為明永樂五年（1407）作品，屬佛像年代，與殿堂年代無關。 依據：忆起追迹（iwenbo.fun）專業文保資料彙編：https://www.iwenbo.fun/heritage/1743.html（二手彙編，頁面未註明原始出處；批次與編號為網站轉錄，官方名錄原文待覆核）（覆核日期 2026-11-27）。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.57337110,112.12792933", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-017"}, {"id": "LL-018", "city": "呂梁市", "name": "交城玄中寺", "loc": "呂梁市交城縣洪相村西北", "era": "現存建築多為明清時期；國保名錄時代標為明至清", "found": "北魏延興二年（472）創建、承明元年（476）落成的寺史記載", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "玄中寺是淨土宗重要祖庭。寺史記北魏創建，隋唐擴建，北宋元祐五年（1090）曾遭大火；國保名錄將現存古建築時代標為明至清。必須區分寺院歷史與現存建築年代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.56386041,112.07844581", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-018"}, {"id": "LL-019", "city": "呂梁市", "name": "則天（聖母）廟", "loc": "呂梁市文水縣南徐村北", "era": "金代則天聖母殿原構；其餘建築主要為明清", "found": "唐代創建；金皇統五年（1145）重建", "level": "第四批全國重點文物保護單位（1996）", "status": "部分覈實", "conf": "A", "note": "則天廟現存核心為金代聖母殿，殿內板門上有金皇統五年重建題記；明正統十三年（1448）及清代多次修葺。木構、斗栱、梁架、神龕及碑廊是重點。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.47720170,112.03819066", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-019"}, {"id": "LL-020", "city": "呂梁市", "name": "上賢梵安寺塔", "loc": "呂梁市文水縣上賢村", "era": "北宋崇寧年間（1102—1106）建塔；明隆慶五年（1571）維修", "found": "北宋崇寧二年（1103）或崇寧五年（1106），不同文獻紀年有差異", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "上賢梵安寺塔又稱上賢塔，七層八角磚塔。地方文史資料引方志記崇寧二年（1103），另有塔內木梁紀年說崇寧五年（1106）；本輪保留兩說，不強行取其一。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.36303932,111.97821647", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-020"}, {"id": "LL-021", "city": "呂梁市", "name": "太符觀", "loc": "呂梁市汾陽市上廟村西北", "era": "金代玉皇上帝殿原構；其餘現存建築以明代為主", "found": "金承安五年（1200）創建醮壇；明萬曆十一年（1583）重建", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "A", "note": "太符觀是本批重要金代木構。現存昊天玉皇上帝殿整體保留金代結構形制，院內彩塑、壁畫、懸塑保存豐富；五岳殿等為明代遺存。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.34397237,111.91766395", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-021"}, {"id": "LL-022", "city": "呂梁市", "name": "杏花村汾酒老作坊博物館(暫停開放)", "loc": "呂梁市汾陽市東堡村", "era": "現址汾酒作坊遺存跨越清代至近現代；需區分生產遺址與博物館展示設施", "found": "杏花村釀酒歷史悠久，現存作坊建築及設備需逐項核定年代", "level": "第六批全國重點文物保護單位（2006），名錄名稱為杏花村汾酒作坊", "status": "部分覈實", "conf": "B", "note": "原始點位標註「暫停開放」，缺少時間戳，不能視為目前仍停業。資料庫名稱寫作老作坊博物館，但國保名錄對應的是杏花村汾酒作坊；參觀前需向管理方確認實際開放及展示範圍。 第六批國保名錄確列「杏花村汾酒作坊」，時代：清，地址：汾陽市（2026-11-25 以官方名錄覆核）。 依據：國務院：第六批全國重點文物保護單位名錄（2006）：https://www.gov.cn/zwgk/2006-06/02/content_297818.htm（覆核日期 2026-11-25）。", "access": "暫停開放", "map": "https://www.google.com/maps/search/?api=1&query=37.34254488,111.90777966", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-022"}, {"id": "LL-023", "city": "呂梁市", "name": "峪口聖母廟", "loc": "呂梁市汾陽市峪口村", "era": "元代正殿及西朵殿；明代聖母殿、配殿；其餘多為清代", "found": "元大德十一年（1307）門墩題記，推定寺廟創建年代", "level": "省級文物保護單位（2004）", "status": "部分覈實", "conf": "A", "note": "峪口聖母廟現存正殿、西朵殿為元代遺構；聖母殿及東西配殿為明代遺存。2006—2008年曾維修。元大德十一年門墩題記是重要斷代依據。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.31901818,111.79954549", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-023"}, {"id": "LL-024", "city": "呂梁市", "name": "柏草坡龍天土地廟", "loc": "呂梁市汾陽市柏草坡村中", "era": "金元時期正殿主體；樂樓、獻殿等主要為清代或後期修繕", "found": "金承安五年（1200）及元至元二十七年（1290）梁架題記", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "柏草坡龍天土地廟又稱龍王土地廟。正殿梁架有金承安五年及元至元二十七年題記，現存正殿主體為金元遺構；樂樓、獻殿等不可一概標為金代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.34331376,111.76135298", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-024"}, {"id": "LL-025", "city": "呂梁市", "name": "汾陽后土聖母廟", "loc": "呂梁市汾陽市田村東", "era": "現存正殿為明代建築，殿內明代壁畫約74.7平方米", "found": "唐代創建說；明嘉靖二十八年（1549）、清乾隆年間重修", "level": "省級文物保護單位", "status": "部分覈實", "conf": "A", "note": "汾陽田村后土聖母廟現僅存正殿一座，東西北壁保存明代壁畫，題材包括宴樂、迎駕、巡幸。唐代創建說屬沿革記載，現存正殿不可稱唐構。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.29485252,111.76048317", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-025"}, {"id": "LL-026", "city": "呂梁市", "name": "汾陽關帝廟", "loc": "呂梁市汾陽市", "era": "正殿（關帝殿）：明嘉靖二十四年（1545）建（網站載背後題跡）；中殿：明正德十五年（1520）重建（網站載脊刹後題字）；其餘殿宇年代未載", "found": "網站稱始建於明正德、嘉靖年間", "level": "全國重點文物保護單位，第八批（網站轉錄編號 8-0229-3-032），所在：汾陽市鼓樓南街東側", "status": "部分覈實", "conf": "B", "note": "網站載廟內有明萬曆九年（1581）重修碑，所記為重修；題跡與題字內容為網站轉述，須核原件。位置為汾陽市區鼓樓南街，與本庫點位標示「汾陽市區」相符，座標精確度待核。 依據：忆起追迹（iwenbo.fun）專業文保資料彙編：https://www.iwenbo.fun/heritage/4854.html（二手彙編，頁面未註明原始出處；批次與編號為網站轉錄，官方名錄原文待覆核）（覆核日期 2026-11-27）。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.26412306,111.77803706", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-026"}, {"id": "LL-027", "city": "呂梁市", "name": "文峯塔", "loc": "呂梁市汾陽市", "era": "明末清初磚塔；建造年代有明末、清順治及康熙等不同說法", "found": "明末清初營建，確切年份仍有爭議", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "汾陽文峰塔為八角十三層樓閣式磚塔，高約85米。地方政府資料稱明末清初，部分資料指清順治或康熙年間；不同來源對始建年份不一，採明末清初較穩妥。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.24466972,111.80930436", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-027"}, {"id": "LL-028", "city": "呂梁市", "name": "汾陽五嶽廟", "loc": "呂梁市汾陽市三泉鎮北榆苑村南", "era": "元至清多時期建築群", "found": "始建年代待考", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "汾陽五岳廟列第六批國保，名錄時代為元至清。現階段未取得可可靠分辨各殿宇建造年代的完整資料，故僅按國保名錄時代標註，不推定某一殿為元構。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.18046367,111.63687858", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-028"}, {"id": "LL-029", "city": "呂梁市", "name": "慈勝寺", "loc": "呂梁市孝義市蘇家莊村", "era": "現存建築群主要為明代；大雄寶殿保存明代彩塑", "found": "金天會年間創建說，寺內有金泰和七年敕賜碑", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "B", "note": "孝義蘇家莊慈勝寺，現存主要建築為明代，寺內大雄寶殿保存十一尊明代彩塑。金代碑刻反映寺院歷史，不代表現存殿宇為金代建築；2003年曾大修。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.16315087,111.74276369", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-029"}, {"id": "LL-030", "city": "呂梁市", "name": "孝義三皇廟", "loc": "呂梁市孝義市賈家莊村", "era": "元代三皇殿原構；其餘現存建築多為清代及民國時期", "found": "創建年代不詳，元代已有", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "孝義賈家莊三皇廟現存三皇殿保存元代原構，其餘多為清代重建；2005年曾保護性修復。需將元代正殿與清代戲樓、配殿等分開觀察。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.13957235,111.74386800", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-030"}, {"id": "LL-031", "city": "呂梁市", "name": "中陽樓", "loc": "呂梁市孝義市", "era": "清宣統元年（1909）重建；1957、1983年大修", "found": "碑記傳稱漢魏始建；元大德七年（1303）地震坍塌，清同治七年（1868）遭雷火", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "中陽樓現存樓體主要為清宣統元年重建，四層四檐、十字歇山頂、全木結構。漢魏始建是碑碣記載的歷史沿革，不能當作現存樓體年代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.12969688,111.80517595", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-031"}, {"id": "LL-032", "city": "呂梁市", "name": "孝義天齊廟", "loc": "呂梁市孝義市中王屯村", "era": "元代正殿遺構；清康熙三十九年（1700）重修；戲台為清代", "found": "始建年代不詳", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "孝義中王屯村天齊廟，正殿依結構特徵判定為元代遺構，梁架題記記清康熙三十九年重修。殿內元代四根方形撐柱上盤龍泥塑是重要看點；戲台為清代遺構。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.07277079,111.82263460", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-032"}, {"id": "LL-033", "city": "呂梁市", "name": "張家河村", "loc": "", "era": "村落本身不是可直接斷代的單體古建築；疑與LL-013殿山後土聖母廟點位相鄰", "found": "不適用；需確認原始標記指向的具體文物", "level": "未能確認", "status": "部分覈實", "conf": "C", "note": "原始點位僅標「張家河村」，座標與LL-013殿山後土聖母廟相距約數百米，疑為同一村域中的另一個定位標記。未找到唯一對應古建築，不將村名本身當作文物單位，也不虛構年代；建議實地核對後再決定是否合併或保留。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.99100036,110.52127762", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/lvliang-batch-06.md#ll-033"}, {"id": "JZ-001", "city": "晉中市", "name": "福田寺", "loc": "晉中市壽陽縣黑水村北", "era": "元代正殿（至順四年，1333）；其餘建築明清", "found": "始建年代不詳", "level": "第六批全國重點文物保護單位（2006）；名錄時代元至明", "status": "部分覈實", "conf": "A", "note": "壽陽黑水村福田寺。正殿為元至順四年（1333）建築，其他殿宇多為明清；2014—2015年整體修繕。 本輪桌面初核；原始座標基準、入口位置及現場開放情況仍須另核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=37.94005478,112.85783362", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jinzhong-batch-07.md#jz-001"}, {"id": " lob/main/places/jincheng-batch-14-part-01.md#jc-048"}, {"id": "JC-049", "city": "晉城市", "name": "陽城文廟", "loc": "晉城市陽城縣", "era": "現存孔聖廟及附屬房屋為明清建築；清康熙二十八年（1689）大成殿火災，道光十九年（1839）修繕並擴建", "found": "宋代始建；明洪武年間由知縣李芾重建", "level": "第八批全國重點文物保護單位（2019；編號8-0240-3-043）", "status": "部分覈實", "conf": "A", "note": "地方祭孔與儒學禮制建築。晉城市政府資料記宋代始建、明洪武重建；1689年大成殿火災後，道光十九年（1839）修繕並擴建大成殿，增建崇聖祠、東西廡及戟門。歷史上包括孔聖廟、明倫堂、文昌宮，現僅存孔聖廟及房屋二十餘間，為明清建築。與太岳軍區司令部舊址的近現代使用史有關，現址邊界待核。", "access": "城內東南隅；當前日常開放、管理方、展陳及拍攝規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.47989227,112.42532069", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-14-part-01.md#jc-049"}, {"id": "JC-050", "city": "晉城市", "name": "開福寺", "loc": "晉城市陽城縣", "era": "現存戲台、獻殿、大雄寶殿；獻殿梁上見元大德元年（1297）題記線索，需核其原位及構件是否原構；大雄寶殿金代／元代斷代存在資料矛盾", "found": "開福寺前身文殊寺始建年代有北齊天保四年（553）與石晉天福四年（939）兩說；金大定年間改稱福嚴寺，明洪武初改今額；須核原版縣志與寺內碑刻", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "B", "note": "原名文殊寺，地方志記北齊天保四年（553）創建，金大定年間改稱福嚴寺，明洪武年間改稱開福寺。現存戲台、獻殿、大雄寶殿。2012年專題報道記獻殿東北角柏木大角梁有元大德元年（1297）題記；獻殿面闊三間、進深六椽、單檐歇山頂，梁架四椽栿對後乳栿，五鋪作單抄單下昂。大雄寶殿年代在轉載資料中有金、元說法矛盾，暫不寫死。", "access": "公開資料稱位於陽城縣實驗小學內／校園一角；訪客進入及拍攝須先取得學校或管理方許可", "map": "https://www.google.com/maps/search/?api=1&query=35.48074628,112.42283423", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-14-part-01.md#jc-050"}, {"id": "JC-051", "city": "晉城市", "name": "潤城東嶽廟", "loc": "晉城市陽城縣潤城村三門街", "era": "現存獻亭、天齊殿、後宮以明代風格為主；左右偏殿等部分建築為清代；明代琉璃脊飾與石雕構件", "found": "據廟內碑刻記載宋代始建；明萬曆二十一年（1593）重修", "level": "第六批全國重點文物保護單位（2006；名錄時代金至清）", "status": "部分覈實", "conf": "A", "note": "供奉東嶽大帝，歷史上為三進院落，設三門、鐘鼓樓、舞台與牌樓。現存獻亭、天齊殿、後宮及左右偏殿；獻亭台基石雕欄杆有石獅、石象、石猴等瑞獸，天齊殿與後宮保存琉璃脊飾、吻獸、博風板、懸魚及惹草。官方資料記占地約3600平方米，較早資料記約1000平方米，範圍口徑待核。", "access": "位於潤城鎮中心三門街一帶；當日開放、殿內進入及拍攝規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.49447179,112.52341851", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-14-part-01.md#jc-051"}, {"id": "JC-052", "city": "晉城市", "name": "下交湯帝廟", "loc": "晉城市陽城縣下交村北", "era": "拜殿為金代建築；正殿、舞樓等主要遺構為明清建築；廟宇整體時代標註宋至清", "found": "北宋政和六年（1116）以前已存在；金大安二年／三年（1210／1211）有重修擴建說，年份來源不一致", "level": "第六批全國重點文物保護單位（2006；宋至清）", "status": "部分覈實", "conf": "B", "note": "供奉成湯大帝，位於河北鎮下交村北高阜。資料顯示北宋時已存在，金代拜殿為重要遺構，現存正殿、拜殿、舞樓及明清碑刻。1210／1211年重修記載有差異。1938年楊尚昆曾到湯帝廟召開會議；抗戰烈士崔振華於1943年在廟內東禪房遇害，古建與近現代革命史需分開考察。", "access": "2024年曾列入每週日階段性開放名單，公告已過期；目前開放、聯絡看護及攝影規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.41449240,112.35685416", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-052"}, {"id": "JC-053", "city": "晉城市", "name": "陽城壽聖寺及琉璃塔", "loc": "晉城市陽城縣陽陵村東北", "era": "琉璃塔為明萬曆三十七年（1609）題記所見工匠營造時期；大雄寶殿據資料為清康熙三十六年（1697）", "found": "地方志轉錄稱後唐創建，天禧年間（1017—1021）重建，治平四年（1067）賜額壽聖禪院", "level": "第八批全國重點文物保護單位（2019；明清）", "status": "部分覈實", "conf": "A", "note": "位於芹池鎮陽陵村東北。現存主要遺存為八角十級琉璃塔及大雄寶殿。塔高約27米，塔基砂石浮雕，塔身各層鑲嵌琉璃佛教故事浮雕；一層後門洞旁有萬曆三十七年題記，署陽城琉璃匠人喬永豐及其子喬常飛、喬常遠。寺院早期沿革來自地方志轉錄；塔竣工年與題記年份需分辨。", "access": "2025年9月政府報道時遊客中心、山門步道、展廳及停車場仍在施工；2026年實際完工與開放情況待核", "map": "https://www.google.com/maps/search/?api=1&query=35.60521203,112.31253339", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-053"}, {"id": "JC-054", "city": "晉城市", "name": "北義城玉皇廟", "loc": "晉城市澤州縣北義城村西北", "era": "玉皇殿為北宋遺構；獻殿、耳殿、配殿、舞樓、廂房等為後世建築", "found": "始建年代不詳；正殿檐柱有北宋大觀四年（1110）二月十五日重修題記；清雍正六年（1728）及道光八年（1828）有修建記錄", "level": "第六批全國重點文物保護單位（2006；宋至清）", "status": "部分覈實", "conf": "A", "note": "坐北朝南、兩進院落。玉皇殿面闊進深各三間，平面近方形，單檐歇山頂、琉璃剪邊，前檐四根八棱青石柱，斗栱四鋪作單抄，梁架三椽栿對前搭牽通檐用三柱。1110年為重修題記，不是創建年份。舞樓與兩側妝樓構成祭祀、演戲空間。2016年曾有文物本體修繕與環境整治。", "access": "北義城村西北；現時開門、看護人員、院內居民使用空間及拍攝規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.64121932,112.94830677", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-054"}, {"id": "JC-055", "city": "晉城市", "name": "碧落寺", "loc": "晉城市澤州縣南連氏村東", "era": "北朝、唐代石窟及摩崖題刻；明代古橋；現存寺院建築多為後世重建", "found": "2012年石窟調查簡報依寺內摩崖題刻提出北魏太和六年（482）創建說；北宋曾稱治平院，元至元五年（1268）改稱碧落寺", "level": "第六批全國重點文物保護單位（2006；石窟寺及石刻，北朝至民國）", "status": "部分覈實", "conf": "A", "note": "依山谷而建，背靠碧落山、面向萬松嶺。2012年調查簡報記3個洞窟、64個小型石龕、約102尊造像；五龍洞有北齊武平七年（576）題刻及北宋崇寧五年（1098）《重建治平院記》。寺內另有唐代李撰為母祈福篆字碑傳承，原碑與重刻本須區分。482年創建說屬調查文章對摩崖題刻的考釋。", "access": "南連氏村東山谷；寺門據報道朝西；石窟高於地面且部分位置不易接近，現時通行及攝影規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.56016921,112.80891529", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-055"}, {"id": "JC-056", "city": "晉城市", "name": "川底佛堂", "loc": "晉城市澤州縣川底村", "era": "正殿存在元代建築說；另有調查資料認為元代重修後仍保留較多金代原構；山門及東西廂房為清代建築", "found": "始建年代不詳；院內碑碣記元至順三年（1335）重修", "level": "第七批全國重點文物保護單位（2013；元至清）", "status": "部分覈實", "conf": "B", "note": "坐北朝南、一進院落，約233平方米，現存正殿、山門及東西廂房。正殿面闊三間、進深兩間，單檐歇山頂，外檐四鋪作斗栱；梁架為四椽栿通檐用兩柱，山面丁栿與耍頭構造具有地方特點。1335年為重修紀年；正殿斷代在元代建築與保留金代原構兩種表述間仍需專業核驗。", "access": "川底村內定位，入口及看護人員待核；院落緊鄰村居，進入及拍攝須先詢問管理方", "map": "https://www.google.com/maps/search/?api=1&query=35.52612638,112.67500530", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-056"}, {"id": "JC-057", "city": "晉城市", "name": "大陽湯帝廟", "loc": "晉城市澤州縣大陽鎮", "era": "成湯殿為元代建築；其餘現存建築分屬明、清時期", "found": "始建年代不詳；《山右石刻叢編》轉錄有乾德五年（967）建殿記載，但晉城市政府古建專題仍標始建年代不詳", "level": "第六批全國重點文物保護單位（2006；元至清）", "status": "部分覈實", "conf": "A", "note": "祭祀商湯，坐北朝南、二進院落，中軸線有戲樓、山門、中門、成湯殿。元代成湯殿面闊三間、進深八椽、單檐懸山頂，柱頭五鋪作雙下昂，梁架使用減柱、移柱造；自然彎曲荊木及粗壯額枋是重要觀察點。967年建殿說來自石刻文獻轉錄，與官方始建年代不詳的表述並列保留。", "access": "大陽鎮西街；可與大陽古鎮街巷一併考察；當日開門、停車及殿內攝影規定待核", "map": "https://www.google.com/maps/search/?api=1&query=35.66881861,112.78199158", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/jincheng-batch-15-part-01.md#jc-057"}, {"id": "JC-058", "city": "晉城市", "name": "府城關帝廟", "loc": "晉城市澤州縣府城村", "era": "現存主要建築為清代：關帝殿、三義殿、戲台、山門 -002"}, {"id": "LF-003", "city": "臨汾市", "name": "師家溝古建築羣", "loc": "臨汾市汾西縣師家溝村", "era": "清代；山西文化資源網記載清乾隆三十二年（1767）起建，經嘉慶、道光、咸豐、同治年間擴建", "found": "清乾隆年間形成；部分地方資料另記乾隆三十四年（1769），起建年份存在兩年差異，需以族譜、匾額或建築題記再核", "level": "第六批全國重點文物保護單位（2006；清）", "status": "部分覈實", "conf": "A", "note": "汾西縣師家溝村清代窯洞民居群，依山就勢形成約31個院落，院落以四合院、三合院及多進院落組合，兼具窯洞、樓院、巷道、排水系統與家族生活空間。山西文化資源網記載總面積4萬餘平方米；其他資料有10萬平方米等不同統計口徑，勿混用。原始座標保留，村落是否全域開放、民居私有範圍及攝影限制待核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.62955719,111.60745028", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-18-part-01.md#lf-003"}, {"id": "LF-004", "city": "臨汾市", "name": "老君洞", "loc": "臨汾市浮山縣梁村", "era": "國保名錄列唐至明；現存核心為老君殿，磚石仿木結構；殿內有明嘉靖十年（1531）石刻及嘉靖四十年（1561）壁畫", "found": "傳統資料稱唐武德二年（619）始建；精確創建紀年仍應以寺內碑刻、正式保護檔案核驗，不把傳說直接當作已證實年代", "level": "第六批全國重點文物保護單位（2006；唐至明）", "status": "部分覈實", "conf": "B", "note": "位於浮山縣張莊鄉梁村。現存老君殿坐北朝南，面闊三間、進深二間，單檐歇山頂，通高約4.4米；殿內壁嵌39塊《太上老君八十一顯化圖》石刻，另存《黃籙朝聖圖》壁畫約77.86平方米。需區分唐代創建傳說、現存殿體及明代石刻壁畫年代；殿內文物攝影與開放情況待核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.94883790,111.79876738", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-18-part-01.md#lf-004"}, {"id": "LF-005", "city": "臨汾市", "name": "熱留關帝廟", "loc": "臨汾市古縣熱留村", "era": "元、明、清多期遺構；正殿保存元代建築手法，明清屢有修葺，現存山門、戲台、獻殿、正殿及東西廊房", "found": "據碑文記載創建於宋代；其後歷代修葺，宋代創建沿革與現存元明清建築須分開", "level": "第八批全國重點文物保護單位（2019；元、明、清）", "status": "部分覈實", "conf": "A", "note": "位於古縣古陽鎮熱留村。坐北朝南，一進院落。正殿面闊七間、進深三間，重檐歇山頂，柱頭斗栱六鋪作，殿內採減柱造，六椽栿通達前後檐，呈現元代作法；屋頂琉璃剪邊。山西省文物局資料記據碑文創建於宋，不能將宋代創建等同現存正殿年代。現行開放、村內停車與入殿權限待核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.43176920,112.00600226", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-18-part-01.md#lf-005"}, {"id": "LF-006", "city": "臨汾市", "name": "廣勝寺", "loc": "臨汾市洪洞縣", "era": "上寺飛虹塔及大雄寶殿為明代；下寺及水神廟主要保存元代建築；水神廟壁畫繪於元泰定元年（1324）", "found": "據《平陽府志》等地方文獻記載，東漢建和元年（147）創建；唐大歷四年（769）郭子儀重修並改名廣勝寺。此為寺院沿革，不代表現存建築年代", "level": "第一批全國重點文物保護單位（1961；廣勝寺）", "status": "部分覈實", "conf": "A", "note": "廣勝寺由上寺、下寺、水神廟等部分構成，須分區記錄年代：上寺現存核心殿塔多為明代，下寺與水神廟以元代遺構為重要特色。水神廟元代壁畫、上寺飛虹塔及《趙城金藏》並稱廣勝三絕。LF-006為寺院總體標記，與LF-007飛虹塔、LF-008水神廟分項座標是不同原始記錄，不合併、不刪除。現行票務、預約及各區開放時間需另查。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.29754267,111.80135135", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-18-part-01.md#lf-006"}, {"id": "LF-007", "city": "臨汾市", "name": "廣勝寺上寺·飛虹塔", "loc": "", "era": "明正德十年（1515）始建，至嘉靖六年（1527）完成；八角十三層琉璃塔，通高約47米", "found": "現存飛虹塔塔體為明代建造；東漢寺院沿革及元大德七年（1303）地震毀塔的記載屬塔院歷史，不可作為現存塔體年代", "level": "第一批全國重點文物保護單位（1961；廣勝寺）", "status": "部分覈實", "conf": "A", "note": "飛虹塔位於廣勝寺上寺，塔身以青磚砌築，逐層出檐並鑲嵌琉璃構件，塔身色彩、佛像與供養人裝飾是核心觀察重點。新華社資料記明正德十年重建，其他研究資料記載1515年開工、1527年完成。此記錄是廣勝寺總體點位之外的獨立原始標記；座標照錄，不以其他地圖座標替換。登塔、近距離拍攝及當日開放限制待核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.30140586,111.80652484", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-18-part-01.md#lf-007"}, {"id": "LF-008", "city": "臨汾市", "name": "廣勝寺下寺·水神廟", "loc": "", "era": "明應王殿為元延祐六年（1319）重建；殿內壁畫為元泰定元年（1324）作品，約13幅、近200平方米", "found": "水神廟始建年代不晚於唐代之說見公開研究；元大德七年（1303）地震後重建，延祐六年（1319）完成", "level": "廣勝寺建築群為第一批全國重點文物保護單位（1961）；水神廟為其組成部分，不另列獨立批次", "status": "部分覈實", "conf": "A", "note": "水神廟是祭祀霍泉水神明應王的風俗神廟，與佛教下寺分開記錄。1324年壁畫含元代戲劇圖《大行散樂忠都秀在此作場圖》。原始座標保留。", "access": "位於廣勝寺下寺西側；明應王殿壁畫入殿及拍攝需遵守現場管理，當前開放與預約待核", "map": "https://www.google.com/maps/search/?api=1&query=36.30295428,111.80203054", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-008"}, {"id": "LF-009", "city": "臨汾市", "name": "洪洞關帝廟", "loc": "臨汾市洪洞縣大槐樹鎮", "era": "國保洪洞關帝廟現存正殿保留元代遺構、獻殿為明代遺構；但尚未證明原始座標指向此國保建築", "found": "國保洪洞關帝廟據清光緒《洪洞縣志》記載元大德十年（1306）由蘇漢臣重建；此沿革暫不套用到原始座標點", "level": "國保洪洞關帝廟為第七批全國重點文物保護單位（2013；元、明至清），但原始點位對象匹配未完成", "status": "待覈實", "conf": "C", "note": "原始座標111.68051555,36.26774582與公開國保洪洞關帝廟座標約111.66677,36.25630不符；附近另有灣里村關帝廟西門線索，禁止僅憑同名套用國保年代及身份。原始座標不移動。 二手彙編載國保洪洞關帝廟位於洪洞縣大槐樹鎮城中心關帝街，正殿保留元代遺構、獻殿明代、其餘清代，編號 7-0904-3-131；該頁將關帝樓創建於「明嘉靖十年」標為1351年，應為1531年，年份與年號不符，不採用。依據：忆起追迹（iwenbo.fun）專業文保資料彙編：https://www.iwenbo.fun/heritage/3384.html（二手彙編，頁面未註明原始出處；批次與編號為網站轉錄，官方名錄原文待覆核）（覆核日期 2026-11-27）。本點位座標與國保座標仍不符，故仍不套用國保年代，維持待覈實。", "access": "原始座標附近有灣里村「關帝廟（西門）」地圖線索；與常青四村國保洪洞關帝廟相距約1.7公里，須現場確認實體", "map": "https://www.google.com/maps/search/?api=1&query=36.26774582,111.68051555", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-009"}, {"id": "LF-010", "city": "臨汾市", "name": "洪洞商山廟", "loc": "臨汾市洪洞縣孫堡村", "era": "正殿（三皇殿）及東配殿為元代遺構；耳殿有元、清遺構，其餘多為清代", "found": "始建年代不詳；明萬曆六年（1578）、清乾隆二十三年（1758）、道光十八年（1838）有重修", "level": "第七批全國重點文物保護單位（2013；明至清）", "status": "部分覈實", "conf": "B", "note": "又名三皇廟，祭祀伏羲、神農、軒轅三皇。原始座標與公開位置相距約十餘米，位置匹配度高；國保名錄時代明至清與元代單體遺構並列記錄。", "access": "洪洞縣趙城鎮孫堡村；現行開放、入殿及拍攝規定待核", "map": "https://www.google.com/maps/search/?api=1&query=36.36405442,111.68527446", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-010"}, {"id": "LF-011", "city": "臨汾市", "name": "淨石宮", "loc": "臨汾市洪洞縣幹河村", "era": "現存建築多為明中後期遺構；正殿保存明代懸塑，東西山牆及後牆有清代壁畫", "found": "明弘治元年（1488）創建說；清順治五年（1648）閏四月有壁畫畫工題記；乾隆、嘉慶及民國年間續有修葺", "level": "第七批全國重點文物保護單位（2013；明至民國）", "status": "部分覈實", "conf": "B", "note": "又稱宮觀廟，分東、西兩院；西院正殿保存明代懸塑，清順治五年（1648）畫工楊成廉等題記。原始座標與公開地理座標高度接近。", "access": "洪洞縣堤村鄉干河村淨石山下；壁畫及懸塑入殿拍攝須現場許可，當前開放待核", "map": "https://www.google.com/maps/search/?api=1&query=36.46460883,111.67255568", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-011"}, {"id": "LF-012", "city": "臨汾市", "name": "洪洞玉皇廟", "loc": "臨汾市洪洞縣辛北村", "era": "玉皇殿、關公殿、二郎殿均為元代原構，部分保存元代壁畫殘跡", "found": "元太宗窩闊台元年己丑（1229）創建；明清及近現代多次修葺", "level": "第五批全國重點文物保護單位（2001；元）", "status": "部分覈實", "conf": "B", "note": "原為二進院落，現存主體集中在後院，三座元代殿堂並列。原始座標保留，現場需核對入口及前院保存範圍。", "access": "洪洞縣辛村鎮辛北村東北角；原始座標與公開位置有約二百米差距，入口及當前開放待核", "map": "https://www.google.com/maps/search/?api=1&query=36.29178252,111.62966614", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-012"}, {"id": "LF-013", "city": "臨汾市", "name": "媧皇廟", "loc": "臨汾市霍州市", "era": "現存主要建築為清代；聖母殿保存約70平方米清代壁畫，乾隆二年（1737）繪製", "found": "始建年代不詳；碑記稱明萬曆三十八年（1610）火災後重建，清同治四年（1865）重修", "level": "第六批全國重點文物保護單位（2006；清）", "status": "部分覈實", "conf": "B", "note": "原始座標與公開地理座標相差數百米，需現場核對村內位置。壁畫面積不同資料有70—74平方米等統計口徑，採約70平方米。", "access": "霍州市大張鎮賈村；曾有訪客遇文保員不在、廟門未開的記錄，須提前聯絡管理人員", "map": "https://www.google.com/maps/search/?api=1&query=36.56195701,111.76201450", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-013"}, {"id": "LF-014", "city": "臨汾市", "name": "霍州鼓樓", "loc": "臨汾市霍州市", "era": "明萬曆十一年（1583）建造，清代屢有修繕；三重檐十字歇山頂木構樓閣與十字券拱基座", "found": "明萬曆十一年（1583）始建", "level": "第八批全國重點文物保護單位（2019；明清）", "status": "部分覈實", "conf": "B", "note": "又稱文昌閣，通高約27米、建築面積約225平方米；四向門洞上方石碑分題「對霍、迎熏、鎮汾、拱辰」。原始座標與公開座標高度吻合。", "access": "霍州市城內十字街中心；周邊車流密集，登樓、開放及停車規定待現場核實", "map": "https://www.google.com/maps/search/?api=1&query=36.56998532,111.71745963", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-19-part-01.md#lf-014"}, {"id": "LF-015", "city": "臨汾市", "name": "霍州觀音廟", "loc": "臨汾市霍州市", "era": "元代過街閣樓；其餘現存建築主要為明、清遺構", "found": "始建元代；明嘉靖年間大修", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "位於霍州市開元街道趙家莊村。核心元構為西軸線過街閣樓，樓下柱廊式通道、樓上重檐歇山頂；其餘山門、三聖殿、觀音堂、大雄寶殿等多屬明清。原始座標與公開地圖點存在約百米級差異，可能涉及座標基準或標記落點，保留原始標記待現場核對。不可把整座廟一概稱為元代建築。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.56604206,111.73652592", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-20-part-01.md#lf-015"}, {"id": "LF-016", "city": "臨汾市", "name": 321年重修。近期公開報導稱暫不具備開放條件，須先取得管理方許可。", "access": "暫不具備開放條件", "map": "https://www.google.com/maps/search/?api=1&query=36.23771702,111.49005395", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-20-part-01.md#lf-019"}, {"id": "LF-020", "city": "臨汾市", "name": "鐵佛寺", "loc": "臨汾市堯都區", "era": "現存山門、過廳、大雄寶殿、金頂琉璃寶塔、藏經樓及配殿主要為清康熙五十四年（1715）重建後遺構", "found": "傳統記載唐貞觀六年（632）創建，原名大雲寺；清康熙三十四年（1695）地震後重建", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "俗稱鐵佛寺，原名大雲寺。唐代創建說與現存清代建築須分開；1695年大地震後，康熙五十四年（1715）重建。金頂琉璃寶塔內保存唐代鐵鑄釋迦牟尼佛頭，佛頭年代不等於塔身及寺院現存建築年代。原始座標與公開地圖點呈國內地圖常見座標系偏移，保留原始座標。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.08161736,111.50220771", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-20-part-01.md#lf-020"}, {"id": "LF-021", "city": "臨汾市", "name": "王曲東嶽廟", "loc": "臨汾市堯都區王曲村", "era": "戲台後部為元代遺構；前部硬山卷棚式抱廈為民國初年增建；廟內其他建築含清代遺構", "found": "廟宇創建年代不詳；戲台後部約建於元代初年，明清曾修葺", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "位於堯都區吳村鎮王曲村。核心價值是元代戲台後部與民國初年增建的前部抱廈形成的複合戲台；戲台坐南朝北，元代部分為單檐歇山頂，內部斗栱藻井構造值得重點觀察。現存東岳廟大殿為清代建築，勿把整座廟宇都稱為元代。原始座標與公開地圖點基本吻合，保留原始標記。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.17204263,111.53429050", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-20-part-01.md#lf-021"}, {"id": "LF-022", "city": "臨汾市", "name": "中國堯帝陵", "loc": "臨汾市堯都區大陽鎮北郊村西", "era": "現存祠宇建築主要為清代乾隆年間重修；2007年後有現代修復及新增景觀設施", "found": "堯陵傳為上古帝堯陵寢，歷史傳說與考古可證年代須區分；祠宇沿革稱建於唐代以前", "level": "第六批全國重點文物保護單位（2006；依地方公開報導）", "status": "部分覈實", "conf": "B", "note": "位於堯都區大陽鎮北郊村西。傳說帝堯陵塚由民眾撮土而成，屬堯文化祭祀與紀念地，不能將傳說年代當作陵墓考古年代。祠宇稱建於唐代以前，現存古建築主要為清乾隆年間修建；2007年景區修復時增加華表、牌坊、琉璃影壁等現代設施，參觀時須區分古建與後建景觀。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.07011962,111.77145119", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-022"}, {"id": "LF-023", "city": "臨汾市", "name": "丁村民居", "loc": "臨汾市襄汾縣丁村", "era": "明代萬曆二十一年（1593）至民國時期，現存明清民居群", "found": "丁村聚落形成早於現存民居；村史起源尚不能由現存宅院精確斷定", "level": "第一批全國重點文物保護單位（1988）", "status": "部分覈實", "conf": "A", "note": "位於襄汾縣新城鎮丁村，汾河東岸。丁村民宅群最早現存宅院為明萬曆二十一年（1593），最晚至民國，延續近四百年；北院以明代建築為主，中、南院多為清代。村中心觀音堂是重要節點，民居裝飾以木、石、磚雕及彩繪見長。不可將1593年寫成丁村建村年份。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.84092143,111.41401403", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-023"}, {"id": "LF-024", "city": "臨汾市", "name": "汾城古建築羣", "loc": "臨汾市襄汾縣汾城鎮", "era": "金大定二十三年（1183/1184，來源紀年有一年差異）至清末", "found": "太平縣治於唐貞觀七年（633）遷至此地；汾城古建築群為歷代累積形成", "level": "第六批全國重點文物保護單位（2006）", "status": "部分覈實", "conf": "A", "note": "汾城原為太平縣縣城，唐貞觀七年（633）遷治於此。現存文廟、城隍廟、明倫堂、縣衙大堂、關帝廟、鼓樓、學前磚塔、社稷廟、洪濟橋、試院及商鋪等多處遺存，形成縣級城市格局。群體年代資料有金大定二十三年1183與1184兩種換算，保留異文；不可把整個古鎮單一斷為金代。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.81900590,111.27204541", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-024"}, {"id": "LF-025", "city": "臨汾市", "name": "靈光寺琉璃塔", "loc": "臨汾市襄汾縣下北梁", "era": "金皇統年間（1141—1149）重建；現存八角樓閣式磚塔，原十三級，今存七級", "found": "靈光寺傳統沿革稱唐代創建；現存琉璃塔按形制及縣志記載斷為金代", "level": "第七批全國重點文物保護單位（2013），名錄時代為金", "status": "部分覈實", "conf": "A", "note": "位於襄汾縣邓莊鎮北梁村西。靈光寺唐代創建說與現存塔的金代斷代必須分開。塔原十三級，現存七級，殘高約22.44米，八角樓閣式磚塔，琉璃斗栱、闌額、垂蓮柱等仿木構細部是主要看點。寺院其他建築在近現代已毀，塔為主要遺存；2020年前後有修復。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.95813606,111.49845984", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-025"}, {"id": "LF-026", "city": "臨汾市", "name": "普淨寺", "loc": "臨汾市襄汾縣史威村", "era": "現存建築群為元、明遺物；大佛殿梁架及斗栱保留元構特徵，元大德七年（1303）重建", "found": "創建年代無確證；寺內明成化元年（1465）殘碑追述東漢永平七年（64），屬後世碑記所載傳說性沿革", "level": "第六批全國重點文物保護單位（2006），名錄時代元至清", "status": "部分覈實", "conf": "A", "note": "位於襄汾縣趙康鎮史威村，古稱南史寺。明成化元年（1465）殘碑追述東漢永平七年（64）創建，但此為後世碑文追記，不能視作東漢建築實物證據。現存為元明建築群，大佛殿梁架及斗栱保留元構，1303年重建說需與寺院始建傳說區分。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.69164672,111.26287942", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-026"}, {"id": "LF-027", "city": "臨汾市", "name": "襄陵文廟大成殿", "loc": "臨汾市襄汾縣襄陵鎮", "era": "元大德十年（1306）重建的大成殿；文廟其餘部分沿革另有增修", "found": "傳統記載金泰和九年（1209）創建；原資料稱「金泰和九年」存在年號問題，應校正為金大安元年（1209）", "level": "第七批全國重點文物保護單位（2013），名錄時代為元", "status": "部分覈實", "conf": "B", "note": "位於襄汾縣襄陵鎮，現址在襄陵糧站內，參觀需先確認管理方進入許可。大成殿元大德十年（1306）重建，面闊五間、進深十椽，單體規模宏大。創建紀年常見「金泰和九年（1209）」寫法不合年號：1209年應為金大安元年，資料中須標出校正，不能照抄錯誤年號。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.02312661,111.40431186", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-027"}, {"id": "LF-028", "city": "臨汾市", "name": "柏山東嶽廟", "loc": "臨汾市蒲縣東關村柏山", "era": "元延祐三年至五年（1316—1318）重修；現存建築及壁畫、塑像包含元明清多期遺存", "found": "始建年代不詳；地方志及碑刻線索稱唐貞觀年間已有修建記載，金泰和五年（1205）已有文獻線索", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "B", "note": "位於蒲縣蒲城鎮東關村柏山之巔，又稱柏山廟。始建年代未能確定；現有資料提及唐貞觀年間修建線索及金泰和五年（1205）記載，需回查原碑與方志。元大德七年（1303）地震後，元延祐三至五年（1316—1318）重修；明清續有修葺，2014—2015年曾修復壁畫與塑像。寺院規模大，兼具東岳行宮、地獄及多組祠殿。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=36.39203415,111.10658095", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-21-part-01.md#lf-028"}, {"id": "LF-029", "city": "臨汾市", "name": "大悲院", "loc": "臨汾市曲沃縣曲村", "era": "現存獻殿為金代遺構；院內其他殿宇多為清代建築；金大定二十年（1180）有重修碑記", "found": "傳統記載唐大和元年（827）創建；北宋治平四年（1067）重修。創建沿革屬文獻記載，現存獻殿本體年代以金代為準", "level": "第五批全國重點文物保護單位（2001）", "status": "部分覈實", "conf": "B", "note": "曲村鎮大悲院；核心遺構是金代獻殿，不能把唐代寺院創建年代套用到現存殿堂。獻殿東側存金大定二十年（1180）《大悲院新修盧舍那佛記》等碑刻。桌面資料初核，原始座標及現場入口仍須核驗。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.73457282,111.54513810", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-22-part-01.md#lf-029"}, {"id": "LF-030", "city": "臨汾市", "name": "東許三清廟獻殿", "loc": "臨汾市曲沃縣東許村", "era": "元代獻殿遺構；元元統元年（1333）重修，2016年完成維修", "found": "據獻殿脊槫下墨書題記，始建於元延祐年間；確切始建年仍宜以題記原件及專業調查報告核對", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "B", "note": "位於曲沃縣高顯鎮東許村。現存獻殿為核心遺存，保留元代梁架、斗栱及題記；元統元年（1333）為重修紀年，不應誤作始建年。桌面資料初核，入口及現場保存狀況待核。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.68857052,111.50458891", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-22-part-01.md#lf-030"}, {"id": "LF-031", "city": "臨汾市", "name": "南林交龍泉寺", "loc": "臨汾市曲沃縣南林交村", "era": "現存大殿為元代建築；影壁為明代，東西廂房為清代", "found": "大殿脊槫下題記記元延祐五年（1318）；寺院沿革以元代為可確認起點", "level": "第七批全國重點文物保護單位（2013）", "status": "部分覈實", "conf": "A", "note": "南林交村龍泉寺。大殿元延祐五年（1318）題記是斷代核心；現存建築跨元、明、清三期。人民日報報導指出古寺曾由村民認養並納入村落文旅開發，但不代表任何日期均可自由入內。原始座標與村內實際入口仍須現場核驗。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.58440922,111.52788002", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-22-part-01.md#lf-031"}, {"id": "LF-032", "city": "臨汾市", "name": "曲沃薛家大院", "loc": "臨汾市曲沃縣", "era": "清代四合院建築，現存南房、過廳、過廳樓、北樓等；具體營建年份本輪未獲一手材料確認", "found": "不適用；清代民居院落", "level": "第八批全國重點文物保護單位（2019）", "status": "部分覈實", "conf": "B", "note": "曲沃縣城樂昌鎮西城巷薛家大院，三進四合院，木雕、石雕和彩繪為主要看點。國務院第八批國保名錄列其時代為清；部分二手資料稱清光緒年間，尚未取得足以鎖定年份的原始題記，故不寫死具體年份。", "access": "", "map": "https://www.google.com/maps/search/?api=1&query=35.63853679,111.46603793", "dossier": "https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/places/linfen-batch-22-part-01.md#lf-032"}, {"id": "LF-033", "city": "臨汾市", "name": "七里腳千佛洞石窟", "loc": "臨汾市隰縣七里腳村", "era": "南窟造像風格判為北魏晚期；北窟造像風格及題材判為初唐。現存兩窟、造像七十餘尊", "found": "石窟開鑿年代分屬北魏晚期至初唐，非單一寺院創建年份", "level": "山西省級文物保護單位（1986）", "status": "部分覈實", "conf": "A", "note": "位於隰縣七里腳村城川河東岸。1998年《文物》調查論文記載兩窟、造像七十餘尊；南窟為北魏
