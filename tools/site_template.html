<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山西古建檔案庫</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2622;--mut:#7a6f66;--card:#fff;--line:#e6ded3;--acc:#8c3b2a;--ok:#2f6b3f;--warn:#9a6a14}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#ece6df;--mut:#a39a90;--card:#26221f;--line:#3a342f;--acc:#e0866f;--ok:#7fc08e;--warn:#e0b25a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.w{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{margin:.2em 0 .1em;font-size:1.6rem}.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
#q{width:100%;padding:11px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;align-items:center}
.bar button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
details.city{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.city>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between}
details.city>summary::-webkit-details-marker{display:none}
details.city>summary::after{content:"＋";color:var(--mut)}details.city[open]>summary::after{content:"－"}
.cnt{color:var(--mut);font-weight:400;font-size:.9rem}
.list{border-top:1px solid var(--line)}
details.site{border-bottom:1px solid var(--line)}details.site:last-child{border-bottom:0}
details.site>summary{cursor:pointer;padding:11px 16px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.site>summary::-webkit-details-marker{display:none}
.nm{font-weight:600}.lv{font-size:.78rem;color:var(--acc);border:1px solid var(--acc);border-radius:20px;padding:0 8px}
.er{color:var(--mut);font-size:.85rem;flex-basis:100%}
.body{padding:2px 16px 14px;font-size:.93rem}.body p{margin:.35em 0}.k{color:var(--mut)}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.go a{padding:7px 13px;border-radius:8px;text-decoration:none;font-size:.9rem;border:1px solid var(--acc);color:var(--acc)}
.go a.p{background:var(--acc);color:#fff}
.b{font-size:.75rem;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.warn{color:var(--warn)}footer{margin-top:28px;color:var(--mut);font-size:.82rem}footer a{color:var(--acc)}
.hide{display:none}
</style></head><body><div class="w">
<h1>山西古建檔案庫</h1>
<p class="sub">449 處古建築與遺存・按城市展開・點景點看年代、級別、看點，並一鍵在地圖定位</p>
<input id="q" type="search" placeholder="搜尋景點、朝代、縣名（如：元代、平順、佛光寺）" autocomplete="off">
<div class="bar"><button id="ex">全部展開城市</button><button id="co">全部收起</button><span class="sub" id="rs"></span></div>
<div id="app"></div>
<footer>
<p>資料以桌面文獻核查為主，<b>不等於現場踏查</b>。「部分覈實」表示朝代有可靠來源，但分殿年代、維修史未查清。地圖座標為原始標記，可能有數百公尺偏移，出發前請在地圖上對照。開放時間、預約、票價請自行向景區或文物部門核實。</p>
<p><a href="https://github.com/Khoohew/Shanxi-Ancient-Architecture">GitHub 倉庫</a>・<a href="https://github.com/Khoohew/Shanxi-Ancient-Architecture/blob/main/data/pending-verification.md">待核清單</a></p>
</footer></div>
<script>
const D=__DATA__;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lvShort(l){if(!l)return'';let m=l.match(/第(.)批全國重點/);if(m)return'第'+m[1]+'批國保';if(/全國重點/.test(l))return'國保';if(/世界/.test(l))return'世遺';return l.length>10?l.slice(0,10)+'…':l}
function site(s){const l=lvShort(s.level);
let h=`<details class="site" data-t="${esc((s.name+s.loc+s.era+s.found+s.level+s.note+s.city).toLowerCase())}"><summary><span class="nm">${esc(s.name)}</span>${l?`<span class="lv">${esc(l)}</span>`:''}<span class="er">${esc(s.era||'年代待核')}</span></summary><div class="body">`;
if(s.loc)h+=`<p><span class="k">位置　</span>${esc(s.loc)}</p>`;
if(s.found)h+=`<p><span class="k">創建　</span>${esc(s.found)}</p>`;
if(s.level)h+=`<p><span class="k">級別　</span>${esc(s.level)}</p>`;
if(s.note)h+=`<p><span class="k">看點　</span>${esc(s.note)}</p>`;
if(s.access)h+=`<p class="warn"><span class="k">開放提示　</span>${esc(s.access)}（未核實，出發前請確認）</p>`;
h+=`<p><span class="b">${esc(s.status)}</span> <span class="b">證據 ${esc(s.conf)}</span></p><div class="go"><a class="p" href="${esc(s.map)}" target="_blank" rel="noopener">📍 在地圖定位</a>${s.dossier?`<a href="${esc(s.dossier)}" target="_blank" rel="noopener">研究檔案</a>`:''}</div></div></details>`;return h}
const app=document.getElementById('app');
app.innerHTML=D.cities.map(c=>{const ss=D.sites.filter(s=>s.city===c);return`<details class="city" data-c="${c}"><summary><span>${c} <span class="cnt">${ss.length} 處</span></span></summary><div class="list">${ss.map(site).join('')}</div></details>`}).join('');
const q=document.getElementById('q'),rs=document.getElementById('rs');
function filt(){const v=q.value.trim().toLowerCase();let n=0;
document.querySelectorAll('details.city').forEach(c=>{let k=0;c.querySelectorAll('details.site').forEach(s=>{const m=!v||s.dataset.t.includes(v);s.classList.toggle('hide',!m);if(m)k++});
c.classList.toggle('hide',v&&!k);if(v)c.open=k>0;n+=k;c.querySelector('.cnt').textContent=(v?k+' / ':'')+c.querySelectorAll('details.site').length+' 處'});
rs.textContent=v?`找到 ${n} 處`:''}
q.addEventListener('input',filt);
document.getElementById('ex').onclick=()=>document.querySelectorAll('details.city').forEach(c=>c.open=true);
document.getElementById('co').onclick=()=>document.querySelectorAll('details.city').forEach(c=>c.open=false);
</script></body></html>
